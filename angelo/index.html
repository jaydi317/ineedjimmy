ghts slip in very quickly and sneakily."}],"vid":"dTZHcy0uX3M"},{"id":11,"title":"See And Be Seen \u2014 For The First Time","series":"","source":"ZDoggMD","youtube":"https://www.youtube.com/watch?v=Ns_dQRxzheA","summary":"Angelo and Zubin explore the profound experience of being truly seen\u2014and seeing others\u2014after awakening. They discuss how reactivity and anger mask deeper identity structures and beliefs, and how investigating emotions reveals the subject-object separation at their core. Angelo describes stages of realization beyond initial awakening: the transition to experiencing no physical form or solidity, encountering existential terror in the shadow, and eventually accessing a state beyond even consciousness itself\u2014a spaceless, formless freedom. They discuss \"specialness\" as a conditioning that keeps us seeking in time and hiding through disassociation, and how letting go of who sees the children or partner reveals what's actually there. The central teaching: when the sense of self is empty, people know they are truly seen\u2014an unconditional witnessing that many humans have never experienced. Being seen and seeing others in this clear, empty way is the natural expression of awakening.","qas":[{"q":"How does investigating anger reveal the fundamental belief in separation?","tags":["emotions","anger","non-duality","separation","practice"],"a":"Anger is a place to look for desire and aversion\u2014pushing and pulling on experience. Anger is intensely associated with the illusory sense that there are boundaries between self and other. When you calm down the heat of anger and look at what's actually causing it, you realize you're angry because of an interpretation of what happened, not because of what actually happened."},{"q":"How do you work with the hotness of emotion instead of reacting?","tags":["emotions","practice","integration","technique"],"a":"First, learn to navigate the intensity of emotion\u2014the \"hotness\" of it. Let yourself feel it; you don't have to act it out. Then, confront the belief that you must react. Notice that reaction isn't automatic; you've been conditioned to believe you have to react when provoked."},{"q":"What is the difference between consciousness and unbound consciousness?","tags":["consciousness","meditation","core-concept","stages"],"a":"After awakening, consciousness becomes obviously spacious and expansive. You can meditate in unbound consciousness by holding awareness of three things simultaneously: (1) the expansiveness or dimensionality of consciousness itself\u2014it feels quite spacious; (2) the sense of \"I\" or the conscious one, the thinker\u2014wherever that seems to be located, as a fluid part of that whole expansiveness; and (..."},{"q":"What happens when you sense there's no physical world?","tags":["stages","non-duality","perception","formlessness"],"a":"At some point in realization, you start to see that there's not an actual physical world\u2014no physical form, no matter, no physicality\u2014in the way the mind has constructed it. This is not about scientific knowledge; it's about direct visceral experience where you literally see through reality. What looks like the physical world in the mind's construction is not what it is."},{"q":"What lies beyond consciousness and form?","tags":["awakening","stages","post-awakening","core-concept"],"a":"There's a place that's truly beyond any consciousness, beingness, or anything in the spiritual realm. It's completely paradoxical and beyond description. It's your true nature, and it's right here all the time. It's not even in a place where \"here\" makes sense\u2014it's neither here nor there, not bound by here or there."},{"q":"What is \"specialness\" and how does it keep us seeking?","tags":["ego","identity","conditioning","seeking"],"a":"We put specialness on things based on conditioning: attention, validation, partners, children, status, fame, expertise. Putting specialness on things is a way of polarizing consciousness. It allows you to forget you're \"the Thinker\"\u2014to disassociate a little, which is an escape mechanism learned in childhood."},{"q":"What replaces the \"specialness game\" in deeper realization?","tags":["awakening","non-duality","integration","presence"],"a":"There's a specialness so beyond the conditional kind that it might not even be related. Once you go through existential terror and the shadow work, you discover that everything is infinitely special\u2014but not situationally special. Every appearance is perfect as it is. It doesn't need to be different, last, be real, or be solid."},{"q":"How does letting go of identification with children or partners change relationships?","tags":["relationships","ego","identity","seeing"],"a":"The key insight is that specialness was never about the other person\u2014it was always an inside job about you. Your children or partner were special because you took pride in them, they made you feel special, they made you feel good or loved. When you see this\u2014that it's the \"me\" aspect you're letting go of, not the \"them\" aspect\u2014you can actually see what's there."},{"q":"What does it feel like to be truly seen?","tags":["intimacy","presence","vulnerability","being-seen"],"a":"When you're truly seen by a presence that's empty and witnessing unconditionally, you feel the whole universe looking at you. At first this can be very squirmy\u2014it exposes defenses and identities you've been holding. But as you relax into it, it becomes clear: nothing needs to be done here, nothing is pushing or pulling, it's just here."},{"q":"What happens when you encounter someone with this kind of clear seeing?","tags":["being-seen","presence","vulnerability","intimacy"],"a":"Even in ordinary conversations\u2014talking about work, the most mundane stuff\u2014the presence of someone who sees clearly can unmask identities. People may feel terrified or exposed. But this isn't about you saying anything; it's about the quality of awareness you're holding. When someone feels truly seen without agenda or judgment, they know it energetically."},{"q":"How does the emotional body integrate after awakening?","tags":["integration","energy","post-awakening","practice"],"a":"After awakening, the emotional body and energetic structures continue to unfold. You might notice resistance to energy moving through\u2014a sense that \"this is too much\" or \"I can't bear this energy.\" Once you see that resistance, you realize it's trying to control or create distance from what's naturally unfolding. When that resistance relaxes, the energy becomes very light."},{"q":"What's the relationship between perception and the \"thought-constructed world\"?","tags":["perception","thought","filtering","conditioning"],"a":"The thought-constructed world is when thoughts tell you what reality is and you believe them\u2014that's the dream. For most people, the world is defined by what their thoughts tell them, plus some sensory input. When that thought-layer relaxes, you have the world as it actually is. The story can still arise\u2014you see it arising and you can notice it, appreciate it even."}],"vid":"Ns_dQRxzheA"},{"id":12,"title":"2 Docs Talk After 8 Days of Silence","series":"","source":"ZDoggMD","youtube":"https://www.youtube.com/watch?v=sCMUMBFo0Qk","summary":"After a week of silent retreat together, two skeptical physicians\u2014Angelo (anesthesiologist, non-dual teacher) and Zubin (hospitalist, science communicator)\u2014explore the paradox of trying to put the unsayable into words. They discuss how language itself distorts direct reality and how silence allows the mind's filtering apparatus to relax. The conversation weaves between the impossible task of describing awakening, the primacy of direct experience over conceptual understanding, and practical guidance for anyone sensing there's a veil between themselves and life. Angelo teaches through his distinctive method of pointing directly at the fundamental question: \"Who is looking?\" The video balances intellectual rigor with the radical simplicity of self-inquiry.","qas":[{"q":"Why is silence so difficult to talk about?","tags":["presence","non-duality","communication"],"a":"Because the moment you reflect on reality and then try to hand that internal reflection to another person through language, you're creating a double distortion. We developed \"theory of mind\" at age four\u2014learning to construct internal realities and communicate them to others. But what's actually right in front of your face is perfect just as it is."},{"q":"What exactly is happening when the mental filter drops?","tags":["awakening","perception","non-duality","sensory"],"a":"Sometimes when you see without that filter for a moment, it's just an aha\u2014this is what presence is. Other times the veil of falsity is completely stripped away and you see what's beyond it, which can be striking or even frightening if you're not expecting it. People think it's a hallucination or psychedelic experience\u2014it's literally the opposite."},{"q":"How should people react when they first experience non-dual perception?","tags":["experience","personality","integration"],"a":"A lot depends on personality. Some people are very demonstrative and talk about everything constantly. Others don't see value in describing it and tend to understate something remarkable. But here's the thing: the experience is beyond conceptualization. Trying to write about it would actually do violence to it."},{"q":"What is self-inquiry and how do you actually do it?","tags":["self-inquiry","identity","practice","no-self"],"a":"During retreat you develop a deepening sense of looking for the one who is looking. You ask directly: Where is this eye that's looking when I look right now? If it's a thought or sensation, that's not it because those are transient. Keep looking. Follow the breadcrumbs back. Don't be surprised if you don't find anything solid right away\u2014not like some thing in the middle of your experience."},{"q":"What's the relationship between identity and suffering?","tags":["identity","suffering","no-self","ego"],"a":"Trace any problem you have\u2014relationships, confidence, depression, anxiety, work\u2014back to its root, and you arrive at: shouldn't I figure out who I am first? But here's the thing: most people convince themselves they absolutely know who they are. They say, \"I'm so-and-so, I came from this place, I was born in this year.\" But those are thoughts."},{"q":"What happens to identity when you realize it's not solid?","tags":["no-self","realization","identity","core-concept"],"a":"There can still be a thought that says \"I blah blah blah\" after deep realization, but there's nothing that refers to it\u2014nothing that reacts to it. It's very clear, exquisitely clear: there's literally nothing. It's just a phenomenon like a leaf falling. Even the thought that says \"I'm the perceiver of this, I'm the one experiencing my life\" is just a thought."},{"q":"How does language trick us about identity?","tags":["mind","thoughts","identity","communication"],"a":"The ego is very agile\u2014really good at finding ways to keep itself perpetuating through distraction, through shifting perspectives, through changing what you're interested in moment to moment. It's like a shell game. The moment you don't give it the distractions anymore, it gets restless, then pissed off, then triggered. You realize how much it actually runs you."},{"q":"What is the core practice when you're in silence?","tags":["meditation","retreat","practice","attention"],"a":"Retreat just gives you a space to get out of social reflection. You're silent, spending time in introspection\u2014and pretty soon it becomes clear that thoughts are arising. You start to disidentify from them: Oh, I'm not the thoughts, so what am I? You're looking in your experience at what is here right now that is looking. You just do that."},{"q":"What is the most fundamental filter that keeps us from seeing clearly?","tags":["filters","perception","barriers","awakening"],"a":"The mind thinks there are separate objects out there and I'm in here. The mind constructs this as obviously true. But it's just a filter. When you get past the more superficial layers of identity, that filter drops out. And then you realize: anything that isn't just this now is a thought. That's it. It's that simple."},{"q":"How do quantum physics and non-duality relate?","tags":["science","non-duality","quantum","perception"],"a":"Through quantum field theory, we know there's literally nothing solid anywhere and nothing separate. There's just a field with excitations. It's not separated in space the way our minds imagine. It's just a convenient way the mind thinks about it. This isn't unscientific\u2014it's just that scientific modeling won't get you to direct realization."},{"q":"What happens to fear when filters start dropping?","tags":["fear","identity","barriers","emotion"],"a":"When things get very quiet through inquiry\u2014who am I before thoughts arise, who am I when I look right now\u2014sometimes there's an autonomic fear response. Heart rate goes up, constriction around the periphery, and a sense of I'm gonna die. But an emotional release follows. And once you're through that fear barrier, there's a shift of an order of magnitude in how perception operates."},{"q":"Is this accessible to someone who hasn't been \"spiritual\" their whole life?","tags":["accessibility","who-can-awaken","mainstream"],"a":"The access is here right now for anyone. This doesn't require meditation experience, a spiritual teacher, a retreat, paying money, reading the right book, special breathing\u2014none of that. You just need to get curious about your own identity, your own sense of self, what it feels like to be you."},{"q":"What's the relationship between monasticism and realization?","tags":["tradition","accessibility","realization"],"a":"Traditionally awakening was equated with monasticism, but there's no necessary connection. You don't have to give up anything. Some of those ancient teachings about it being harder for a rich man to enter the kingdom of heaven\u2014those are more metaphorical than practical. What they point at is that you'll indirectly investigate your attachments through direct inquiry."}],"vid":"sCMUMBFo0Qk"},{"id":13,"title":"What Happens on Silent Meditation Retreat","series":"","source":"ZDoggMD","youtube":"https://www.youtube.com/watch?v=VuTQYziA3Yo","summary":"Angelo and Zubin debrief after leading a transformative six-day semi-silent retreat at Asilomar with 30 healthcare professionals and supporters. They explore the radical difference between daily meditation (calming, centering) and prolonged meditation (revealing the volume of thought, destabilizing the mind's habituality). The conversation addresses practical retreat experiences\u2014the initial thought storm, de-identification from mind-content, the emergence of collective empathic presence (what Zen calls \"joriki\"), emotional breakthroughs, fear responses, and the natural integration of presence that happens when you remove distraction. Both share personal experiences of opening the heart through retreat, and Angelo teaches how retreat becomes \"rocket fuel\" for self-inquiry and awakening, while remaining grounded and non-dogmatic about the path.","qas":[{"q":"What is the fundamental difference between daily meditation and retreat meditation?","tags":["meditation","retreat","practice","attention"],"a":"Daily meditation\u201420, 30 minutes, even longer\u2014has a relaxing, centering, calming effect on the mind and body. It's enjoyable once you're seasoned at it. But when you sit in retreat for one day, two days, three days, four days, it becomes a completely different ballgame. The mind likes to be calm for a short period but doesn't like to be calm for a long period. It starts to act up."},{"q":"What's actually happening when it feels like \"more thoughts\"?","tags":["meditation","mind","de-identification","practice"],"a":"What you're perceiving as a whole bunch more thoughts is not actually more thoughts than you usually have. You're just perceiving them as thoughts instead of as you, as your actual reality. Think of it like a river: you're usually floating down in the boat with all your stuff, looking at your belongings and the water, moving at the same speed. You're lost in the thought stream."},{"q":"How long does the initial chaos last?","tags":["retreat","practice","stages","meditation"],"a":"Usually within the first day, day and a half, it seems like the volume goes up in your mind. But here's the beautiful part: that's the first step\u2014de-identification. You have to be aware of thoughts as such before the mind can really calm in a profound way, much more profound than daily meditation. This starts to happen usually day two, three, up till day four."},{"q":"What is joriki and how does it change the experience?","tags":["retreat","joriki","collective","energy","presence"],"a":"Joriki is a Zen term for meditative concentration that builds in a retreat setting. It's not like you personally are making it happen\u2014it just builds in the environment and every single person is experiencing it. It's quite powerful. You can drop deep into meditation very quickly the moment you sit down, and it starts happening faster and faster each time you sit."},{"q":"How do people really communicate in silence?","tags":["communication","body-language","presence","energy"],"a":"Ninety percent of communication is non-verbal anyway\u2014facial expressions, body movement, body language, voice tone. We pick up body language all the time, even when lost in thought. If someone in the room gives a weird vibe, you notice. If two people are having a quiet argument in a restaurant, everyone feels it. In retreat, that superficial layer is scraped right off."},{"q":"What is a \"heart opening\" and why does it happen in retreat?","tags":["emotions","heart","opening","emotional-intelligence","shadow-work"],"a":"When you sit without moving, without giving your mind anything to distract it for hours on end, you go through emotional experiences\u2014frustration, restlessness, sadness, grief, anger. Everyone else in the room can feel these. When someone sits in profound emotional release, others feel it and a deep empathy arises. You realize: I know what it feels like to be restless."},{"q":"What does it mean when the heart opens physically?","tags":["body","emotions","energy","integration"],"a":"There are physical manifestations of repressed emotion. Zubin had a lifelong sensitivity in his sternum\u2014couldn't touch it without a violent reaction. During retreat emotional release, he felt that space as a crumbling wall opening. He put his hand there for the first time ever without recoil. That's an opening. It's not magic\u2014these openings can close again\u2014but it's a process."},{"q":"Is it dangerous to have a retreat without proper support?","tags":["retreat","support","barriers","safety"],"a":"Some retreat types\u2014like Goenka Vipassana (10-day retreats with body scanning, limited support)\u2014can destabilize people without proper integration support. If you're a seasoned meditator with experience, it's fine. But people who don't know what they're getting into have ended up very destabilized long-term because they didn't know how to integrate it."},{"q":"What happens in the semi-silent structure?","tags":["retreat","integration","practice"],"a":"The semi-silent aspect\u2014silent days with evening talks and interactions\u2014is jarring at first when you transition from silence to talking. But it teaches you how to come back into the world. You practice integrating the presence you're feeling with actual human connection, talking, but only saying what's necessary. Unnecessary speech naturally drops away."},{"q":"What is samadhi and how does it feed awakening?","tags":["samadhi","concentration","meditation","presence"],"a":"Samadhi is meditative concentration and knowingness\u2014a unified mind state. In retreat it becomes a palpable presence. The mind unifies around the intention: this is what we're doing. All the unconscious parts come together. That is so powerful. The energy that develops (joriki/samadhi) is like currency you've built. Don't squander it."},{"q":"How does sitting in pain teach you?","tags":["pain","resistance","meditation","body"],"a":"In Zen sesshin, sitting in zafu (Zen cushion) for one hour is manageable. Three hours gets painful. Four to six hours gets very, very painful\u2014knees, legs. Day two you're like, \"What am I doing? Why?\" You can't even meditate, just pain, pain, pain. Then day three/four all of a sudden the pain turns off like a switch. You realize: all that pain was just resistance."},{"q":"What is the role of doubt during retreat?","tags":["doubt","practice","barriers","mind"],"a":"Doubt comes as a thought storm during retreat. \"You're not worthy of awakening. This is a waste of time. This isn't working. I felt blissful five minutes ago and now I'm up in my head.\" That's when the real work happens. Those moments of suffering\u2014that's the fuel. That's what suffering is, what mind identification is."},{"q":"What is the relationship between inquiry and retreat?","tags":["self-inquiry","retreat","practice","awakening"],"a":"Inquiry in retreat is rocket fuel. If you have a real fire underneath you and a burning desire for awakening, to dig into the root of identity, you can add inquiry on top of just sitting. In that environment with samadhi and support, you'll go through all kinds of experiences\u2014destabilization, emotional patterns that come and go, periods of profound presence, layer after layer of experience."},{"q":"What exactly is shikantaza meditation?","tags":["meditation","technique","practice","zen"],"a":"Shikantaza is \"just sitting\"\u2014Dogen's style from Soto Zen. You're already Buddha-nature; just sit. There's no technique. Whatever is happening is happening non-judgmentally and awareness goes where it goes. You allow yourself surrender\u2014it sounds like you're doing nothing and you aren't. There's no you doing anything."},{"q":"What happens when you integrate inquiry into retreat practice?","tags":["self-inquiry","awakening","practice","stages"],"a":"Throughout retreat, you're looking for the one who is looking, developing a deepening sense of self-inquiry. \"Where is this eye that's looking when I look right now?\" You keep going until there's just looking, and then it becomes very hard to talk about. At some point the filters drop out."},{"q":"Can you have awakening through retreat without being spiritual?","tags":["accessibility","who-can-awaken","mainstream"],"a":"People have come to retreat from all walks of life. This is not about spirituality; it's about your own direct experience. If you feel like there's a veil between you and life, that something doesn't feel right in how you're living or thinking about yourself, or if you remember a profound innocence as a child and it's nowhere to be found\u2014that's the entry point."}],"vid":"VuTQYziA3Yo"},{"id":14,"title":"Angelo Interviews ZDoggMD (Zubin's Story)","series":"","source":"ZDoggMD","youtube":"https://www.youtube.com/watch?v=SChalT87vnM","summary":"In this deeply personal interview, Angelo DiLullo sits down with Dr. Zubin Damania (ZDoggMD), a public figure and physician who found himself increasingly questioning the meaning and sustainability of conventional medicine and success. Zubin shares his journey from childhood in rural California \u2014 marked by a deep intuitive sense that \"there's more to reality than what we see\" \u2014 through medical school, burnout in clinical practice, and ultimately a profound awakening experience that led him to reimagine his life and work. Rather than continuing to suffer through traditional medicine, he created his alter ego ZDoggMD as a way to express creativity, challenge the system, and eventually integrate a spiritual understanding of health and consciousness. The conversation explores how Zubin moved from resistance and rebellion against conventional paths, through despair and dissolution, to a place of authentic expression and service grounded in awakened awareness.","qas":[{"q":"Tell us about your background and where you came from","tags":["angelo-story","personal-history","background"],"a":"Both of my parents are from India with Persian Zoroastrian heritage dating back to pre-Islamic Iran. They fled during Islamic conquests centuries ago. Both became physicians\u2014my mother a psychiatrist, my father an internist. I was born in New Jersey but moved to Fresno, California at age eight."},{"q":"How did your parents view medicine as a career for you?","tags":["family","conditioning","identity"],"a":"Interestingly, both my parents actively discouraged me from medicine. My father would say to go into business where the money is\u2014he's driving a Camry while his business-owning friends drive Lexuses. Both parents had suffered tremendously training in India, retraining in America, and then struggling in private practice."},{"q":"What was your relationship to school and the conventional path?","tags":["conditioning","rebellion","authenticity"],"a":"I had strong oppositional defiant tendencies from early on. I never felt like I fit into the standard way people lived their lives, and it seemed abhorrently painful\u2014why would we exist just to slog away at meaningless work? Looking at my fourth-grade yearbook, I wrote that I wanted to be a famous singer and wasn't interested in the grind."},{"q":"How did singing and comedy function differently for you?","tags":["performance","expression","identity"],"a":"Comedy and singing were connected for me, but singing felt more authentic and natural. Comedy served a protective function\u2014getting people to laugh allowed me to control social distance and manage my sense of insecurity. But when I sang, there was something more genuine."},{"q":"How did your medical training unfold?","tags":["healthcare","conditioning","identity"],"a":"I got into medical school somewhat reluctantly and with a lot of internal resistance. I went to UCSF, one of the top medical schools, and was surrounded by incredibly smart people. The experience was intense\u2014everyone was competing, trying to prove themselves, and there was this sense of scarcity. During my surgery rotation, I saw things that troubled me deeply."},{"q":"What was your clinical experience like after medical school?","tags":["burnout","suffering","healthcare","awakening"],"a":"After training, I moved to San Francisco and started practicing medicine. It seemed like it should be fulfilling\u2014I was helping people, I was a real doctor now. But it became increasingly clear that the system was broken. I was seeing patients, running diagnostic tests, prescribing medications, but none of it was addressing the actual root of their suffering."},{"q":"What was the turning point that led to your awakening?","tags":["awakening","meeting-angelo","catalytic-moment","suffering"],"a":"I met Angelo about a year and a half before this interview, and it changed everything. Here was a guy who had gone through genuine spiritual awakening, who wasn't performing, who was genuinely present. He wasn't trying to convince me of anything or prove anything. He just was."},{"q":"How did your wife's spiritual experience impact you?","tags":["relationships","awakening","support"],"a":"My wife went into a deep spiritual process, and watching her go through that transformation was profound. She seemed to be touching something real, something truer than what I was doing. There was an authenticity and realness in her experience that made the burnout I was experiencing feel even more stark by comparison."},{"q":"What led you to create the ZDoggMD persona?","tags":["zdogmd","rebellion","creativity","expression"],"a":"I had this massive amount of creative energy and rage at the system. Medicine wasn't allowing me to express what I really thought, to critique what was broken, or to be myself. So I created ZDoggMD as a total outlet\u2014irreverent, funny, willing to say things that a respectable doctor couldn't say. It started as rebellion against the constraints of being a \"normal\" physician."},{"q":"How did awakening change your relationship to ZDoggMD and performance?","tags":["awakening","authenticity","integration","performance"],"a":"As I went deeper into my own awakening and dissolution, something shifted. ZDoggMD wasn't about proving anything or rebelling anymore. I realized I could still critique the system, still be irreverent and funny, but from a completely different place\u2014not from anger and resistance, but from genuine care and love for humanity."},{"q":"What does dissolution or emptiness feel like in awakening?","tags":["awakening","dissolution","emptiness","non-self"],"a":"Emptiness is not depressive or nihilistic\u2014it's liberating. It's like the sense of \"me\" that was defending, performing, trying to be somebody or prove something just dissolves. All the stories I've been telling myself about who I need to be, what I need to achieve, how I need to look to others\u2014they become transparent. What's left is a kind of spaciousness and immediacy."},{"q":"How has awakening changed your relationship to work and medicine?","tags":["awakening","healthcare","integration","meaning"],"a":"The fundamental relationship to work transformed. Before, work was a grinding necessity, something imposed on me, something my parents' suffering taught me to fear and resent. After awakening, I still engage with medicine and my platform, but from a completely different place. There's no urgency to prove something or fix something broken in me."},{"q":"What do you understand about consciousness and health now?","tags":["consciousness","health","awakening","non-duality"],"a":"Health isn't primarily a physical problem to be solved with medications and procedures. The root of most suffering is a disconnection from our authentic nature\u2014from presence, from each other, from what's really true. People come in with physical symptoms, but the deeper issue is that they're living fragmented, disconnected lives under massive amounts of stress. Medicine can't fix that."},{"q":"How do you balance being authentic while engaging with a large platform?","tags":["authenticity","presence","teaching","mainstream"],"a":"The key is not trying to be anything other than what you actually are in the moment. When I'm talking to an audience or online, I'm just present. I'm not performing a version of Zubin that I think people want to see, and I'm not trying to convince anyone of anything."},{"q":"What would you say to someone going through their own awakening or spiritual opening?","tags":["awakening","advice","path","surrender"],"a":"Don't try to make it happen and don't resist it when it starts happening. Both seeking and resistance come from the assumption that something's wrong that needs to be fixed. When the dissolution starts, when things you thought were solid start to become transparent, that's not a problem\u2014that's liberation. Trust the process even when it's terrifying."},{"q":"How do you talk about awakening with medical audiences?","tags":["healthcare","teaching","awakening","mainstream","science"],"a":"With medical colleagues, I frame it in ways that don't sound foreign or threatening. I'll talk about how presence and stress reduction affect physiology, how disconnection underlies disease, how consciousness influences health. I use the language and framework of medicine to point toward something that transcends medicine."}],"vid":"SChalT87vnM"},{"id":15,"title":"Awakening Q+A LIVE","series":"","source":"ZDoggMD","youtube":"https://www.youtube.com/watch?v=Gd1CUSBXC5Q","summary":"This is a live Q&A session with Angelo DiLullo and ZDoggMD that dives deep into identity, awakening, and the nature of consciousness. The conversation explores what happens when identity disentangles from thought, the difference between temporary mystical experiences and permanent awakening, the role of fear as a barrier to realization, and how deeply rooted patterns of desire and aversion keep the sense of self alive. Angelo describes the mechanics of how the ego operates, the necessity of surrender, and how awakening unfolds through multiple stages\u2014from the first big shift (experiencing yourself as boundless consciousness) to non-dual realization (dissolving the subject-object split entirely). Throughout, they address practical obstacles like tinnitus during meditation, the role of prayer and surrender, and how spontaneous action works without a sense of doership.","qas":[{"q":"How should we understand identity and what happens when it shifts?","tags":["identity","core-concept","no-self","consciousness"],"a":"We normally take our identity to be a collection of thoughts, beliefs, and memories about who we are. But if you investigate directly, you can touch into deeper identity structures. The fundamental shift is realizing that the sense of \"me\"\u2014the thinker, the subject\u2014is not separate from the entire thinking process and every thought you've ever had."},{"q":"What is the difference between a peak experience and awakening?","tags":["awakening","experience","core-concept","peak-experience"],"a":"A peak or mystical experience is just that\u2014an experience that comes and goes. Awakening is fundamentally different. It's not an experience; it's direct knowing of how reality actually is. It's self-validating, irreversible, and requires no buy-in from you. The mind's construction of reality is effortful and requires effort; awakening just is."},{"q":"What is the physiological fear response that happens near awakening?","tags":["fear","barriers","emotions","practice"],"a":"When your identity starts to disentangle from thought, the body has no way to interpret this except as death or danger, so it triggers a literal physiological fear response. Your heart rate goes up, you feel muscular tension, fear arises. The good news is the body learns. If you go through this experience several times, usually the fear reaction just stops."},{"q":"How do you work with distractions like tinnitus during meditation?","tags":["practice","barriers","attention","sensory"],"a":"The key is to notice the thoughts that say \"I don't want this.\" When you notice that first thought (\"here comes the tinnitus, it will distract me\"), there's a hidden, more subtle thought underneath: \"and I don't even like that I'm aware of that.\" You trace it back until you realize it's really one pattern\u2014a resistance pattern."},{"q":"What are the different levels of \"presence\"?","tags":["presence","core-concept","stages","non-duality"],"a":"Presence has multiple levels. First is a conceptual reminder\u2014bringing attention back from daydreaming or rumination to what's actually here now, noticing your breath and the room around you. Second is realizing you ARE presence\u2014not just that you can be present, but that presence and you are the same thing. It's a luminous conscious space that's everywhere, and all there is."},{"q":"How does identity dissolution work if the ego is meant for survival?","tags":["ego","evolution","consciousness","identity"],"a":"The ego as I describe it isn't a single thing you can remove; it's a collection of thought patterns, impressions, and experiences. But I'm not convinced it's required for survival or evolution. You can function completely normally without thought\u2014you can work, cook, maintain relationships, everything anyone else does."},{"q":"How do you work with the ego's tricks and false dichotomies?","tags":["ego","mind","thoughts","practice"],"a":"The ego is a magician that knows how to redirect your attention. It creates false dichotomies: \"Either you dedicate yourself to awakening RIGHT NOW or you go about your normal life and make videos.\" But this is just misdirection. The point isn't which external reality is true; the point is that your attention got pulled up into those thoughts. All of it is just thought."},{"q":"What happens if you stay in the space between thoughts?","tags":["practice","meditation","unbound-consciousness","stages"],"a":"Once you can stay in the unbound conscious state and you've moved through the fear barriers, I usually just say: there's nothing more you need to do. Keep looking for the very subtle thoughts that arise\u2014thoughts like \"did I almost wake up?\" or \"I must be close now.\" These narratives feel like your own perception, not thoughts. Keep looking at them but don't do anything else."},{"q":"What is the role of spiritual terminology and belief systems?","tags":["accessibility","tradition","mainstream","terminology"],"a":"I'm loose with terminology on purpose because what I care about is people actually waking up to the deeper truths of what they are. Any term used consistently will get co-opted by ego structures, so I rotate my language to keep pulling the rug out from under those structures. Whether you call it \"spiritual\" or not doesn't matter to me."},{"q":"Can meditative prayer be a gateway to awakening?","tags":["prayer","surrender","practice","technique"],"a":"When I talk about prayer, it's more like intention based on surrender. A powerful prayer is something like: \"I admit I don't know what's real. I have beliefs, but I'm willing to let them go to come in contact with living truth or what's most real. I'm willing to go through whatever I need to go through and feel whatever I need to feel, and let go of what I need to let go of."},{"q":"How important is surrender to awakening?","tags":["surrender","core-concept","helplessness","trust"],"a":"Surrender is the most important thing at some point. How do you move beyond yourself when you take yourself to be yourself? It's tricky. It requires extraordinary surrender. The first big awakening shift for most people is ultimately an act of surrender. But here's the paradox: you can't really \"do\" surrender."},{"q":"What is shikantaza (just sitting) meditation?","tags":["meditation","practice","zen","technique"],"a":"Shikantaza is associated with Soto Zen and the saying \"just sitting\u2014you already are Buddha nature.\" It's not actually a technique at all, though the mind usually tries to turn it into one. It's pointing to the recognition of awake nature that you already are."},{"q":"How does spontaneous action work without a sense of doer?","tags":["non-duality","doership","spontaneity","action"],"a":"This can't be given as a conceptual model because it has to be experienced directly. In language, I might say it's like a particle and antiparticle coming into being and dissolving simultaneously out of nothingness\u2014what physics calls dependent origination or superposition. The universe exerts itself to create this reality right now (Dogen's \"total exertion\")."},{"q":"Why is the Heart Sutra so powerful if it seems like nonsense?","tags":["tradition","non-duality","paradox","core-concept"],"a":"The Heart Sutra is full of paradoxes that sound like nonsense poetry, yet when you read it, you know there's something there. The thing is: stop referencing the mind to make sense of it. When you do, everything looks very different. As physicist Niels Bohr said, when we contact a paradox, we know we're contacting truth."},{"q":"What happens when people encounter unfiltered reality through your pointing?","tags":["transmission","presence","emotions","accessible"],"a":"It's common for people to have emotional responses when encountering unfiltered reality, however it happens\u2014whether someone points to it, through teaching, or through direct experience. The response itself is significant. If there's something about the way someone speaks that triggers emotion or realization, that's because they're speaking from presence, from unfiltered reality."},{"q":"What should someone do when they notice the thoughtless space?","tags":["practice","presence","fascination","curiosity"],"a":"Don't think about it. If you're noticing it, that's great. If you're interested and curious, just sit with it when it comes. Don't try to analyze it or figure out what it is. Let your natural curiosity\u2014or better, fascination\u2014just steep itself in the experience."},{"q":"Is there a way to understand these concepts without getting lost in words?","tags":["core-concept","paradox","non-dual","accessibility"],"a":"People say nothing you can say about this is true, and I'd agree\u2014but not completely. If someone is inclined to wake up, words can be helpful because the intellect is a mail slot through which information enters. If you're not open to it, it will literally sound like nonsense. That's fine. There's nothing wrong with that."}],"vid":"Gd1CUSBXC5Q"},{"id":16,"title":"Guru Viking Ep 105 \u2014 Dr. Angelo DiLullo (Simply Always Awake) Full Biography Interview","series":"","source":"Guru Viking Podcast","youtube":"https://www.youtube.com/watch?v=l2LZvO9wotM","summary":"A 2+ hour deep biography interview where Angelo DiLullo, anesthesiologist and author of \"Awake: It's Your Turn,\" walks through his complete spiritual journey with interviewer Raz. The conversation spans his childhood existential angst and mind-identification suffering, his discovery of Transcendental Meditation at 19, a transformative encounter with a Buddhist teacher at university, his reading of \"The Three Pillars of Zen,\" and his radical awakening at 24. Angelo details the immediate experience of consciousness-only states, the shocking discovery of no-self that dissolved the individual completely, the 15-year silent integration period, the emotional and somatic decompression that followed, and his eventual emergence as a teacher. He addresses post-awakening conditioning work, the paradox of sexual interest after realization, the role of inquiry and surrender, and his absolute certainty that anyone who genuinely wants to awaken can.","qas":[{"q":"Tell us about your childhood and what led you to meditation at 19","tags":["angelo-story","suffering","mind-identification"],"a":"I'd summarize it in one word: suffering. Not terrible circumstances, but I felt emotions of others intensely even as a young child with lots of presence. By older childhood, I became aware of the entrapment of thought itself\u2014I could see thoughts forming, using imagination as escape, but they felt deeply uncomfortable. By pre-teen years (12-14), I felt completely out of sorts."},{"q":"How would you have articulated your suffering at that time, and do you have insight into why it was so profound compared to typical teenage angst?","tags":["angelo-story","suffering","conditioning"],"a":"At the time, I probably couldn't articulate much beyond \"what is wrong with me\" on repeat. Looking back, I see I was experiencing profound existential angst\u2014not just normal adolescent angst. I knew the problem was somewhere \"up here\" (pointing to head) in thought itself, but I couldn't explain it."},{"q":"How did you first encounter spirituality?","tags":["angelo-story","meditation","transcendental-meditation"],"a":"Through martial arts. I met an old hippie who had learned Transcendental Meditation directly from Maharishi in India in the 1960s\u2014he actually knew all those guys from that era. He taught me mantra meditation. I took to it instantly\u2014like a fish to water. It was so relaxing and peaceful."},{"q":"What did you do after that first taste?","tags":["angeles-story","practice","meditation"],"a":"I equated meditation with progress, so I just kept meditating. I didn't have anything else to go on\u2014no internet, no non-duality teachings. When I went to bookstores, the spiritual section was a mishmash of pseudo-spirituality and new age material I couldn't sort through."},{"q":"What changed after those years of meditation?","tags":["angelo-story","practice","catalyst"],"a":"Several things happened. First, I went through a breakup with someone who I'd idealized as the perfect partner I should want to be with. When it fell apart, I realized that nothing in the usual human way\u2014no relationship, no partnership\u2014was actually going to satisfy me. The rug was pulled out. This was devastatingly sad but paradoxically, something sublime opened alongside the sadness."},{"q":"What was the book that changed everything?","tags":["angeles-story","catalyst","books"],"a":"\"The Three Pillars of Zen.\" I'd had it on a shelf for a while\u2014bought for a class probably. I opened it and somehow found the enlightenment encounters chapter. It was about ten people describing their awakening (ken sho)\u2014lay practitioners and monks\u2014talking about their before, what led to it, and how they perceived it. As I read each story, I felt something crack open again and again."},{"q":"What did you do with that realization?","tags":["angeles-story","self-inquiry","practice"],"a":"I read through the other chapters trying to discern how the teacher had pointed these people to awakening. I figured it out myself somehow\u2014it became a one-pointed meditative experience for me. It wasn't a formal method or technique; it was more like my whole being became oriented toward the one thing described in those stories."},{"q":"Can you describe what happened during your awakening experience?","tags":["awakening","consciousness","non-dual"],"a":"The first shift was into consciousness itself. Everything that was \"self\" and \"world\" dissolved into pure consciousness\u2014unbound, unthinking, clear. There were no thoughts about it, no dimension or spatial thoughts. I noticed there was only that conscious material that thoughts arose in and dissolved back into. It was incredibly enjoyable\u2014true bliss, but neutral, not ecstatic."},{"q":"What happened when you sat the next day?","tags":["awakening","no-self","non-duality"],"a":"The bliss of consciousness was there immediately. But then something else happened\u2014something I didn't put in the book. I went away into consciousness, and then the whole world itself went away. Existence went away. Even awareness went away. Everything went away completely. And then the self-structure was gone and never came back."},{"q":"How do you describe the certainty of no-self?","tags":["no-self","certainty","core-concept"],"a":"The certainty is that there is no self\u2014not in the way our minds construct it or instinctually feel it. That's just not there. It's so obviously true that I could say it's true for everyone: there is no self anywhere, never has been, never could be in that conventional way. It's like waking up from a dream so obvious you can't forget it."},{"q":"What did you know immediately after this realization?","tags":["no-self","spiritual-seeking","post-awakening"],"a":"I knew immediately that this was what spiritual seekers want. Then the next day, I had the distinct knowing that this is actually what people don't want\u2014they're avoiding it. Not because it's bad, but because there's nothing for the person in it. There's nothing for the self, because there is no self."},{"q":"Did you have visions of past lives?","tags":["angelo-story","mystical-experience","past-lives"],"a":"Yes, though I hesitate to say this publicly. I could see multiple lives lined up that I'd gone through this awakening progression in, over and over. Each time it had progressed a little more. I knew that in this lifetime I was going to go back through conditioning and look at it exquisitely closely so I could explain it."},{"q":"Did you teach or talk about this awakening immediately after?","tags":["angelo-story","post-awakening","silence"],"a":"No. It never even crossed my mind to talk about it. After this happened at 24, I just went and lived. Spirituality was over. Seeking was over. I was over. There was just life happening. I didn't mention it to anyone for 15 years\u2014not even to my spouse. It's strange. I didn't think anyone would want to know about it. Even when I got a zen teacher and worked on koans, I never mentioned it to him."},{"q":"How did you respond to your zen teacher?","tags":["angelo-story","zen","teaching"],"a":"I developed a formal teacher-student thing to work on koans for a couple years during medical training. But I never really talked to him in great detail about any of it. To be honest, I think I just wanted to sample the zen experience\u2014do the sesshins, feel the pain, do the work. The strange thing is that the koans felt already solved to me."},{"q":"What happened to your interests after awakening?","tags":["post-awakening","interest","consciousness"],"a":"Most interests remained though not spirituality. I've always been curious about science and scientific theory, but more than that, I'm interested in conditioning\u2014what the roots of suffering are, what delusion is. This happens automatically in direct experience, not cognitively. I watch how the mind moves, where delusions form and dissipate, how inquiry works."},{"q":"What changed about your sexual interest after awakening?","tags":["post-awakening","sexuality","conditioning"],"a":"It dramatically reduced. What I didn't realize was how much sexual interest was mental\u2014produced by the mind in non-sexual contexts, becoming preoccupation. It's a convenient distraction and something the ego can endlessly seek. That went away. What remained is that the body can still respond physiologically when in proximity with another body. In those moments, it can happen naturally."},{"q":"Do you still have preferences for things?","tags":["post-awakening","preferences","identity"],"a":"The body-mind still enjoys things and has preferences. The difference is the cognitive construct of the self for whom it all seemed to be happening\u2014which would magnify it endlessly and drag it through time\u2014is gone. So things are very singular: here and gone, here and gone. Food is enjoyed in the moment but not charged with the self's story around it."},{"q":"What was the post-awakening integration like?","tags":["post-awakening","integration","shadow-work"],"a":"Everyone experiences post-awakening differently, but there are commonalities. Everything that's been repressed comes completely to the surface into consciousness. You still have behavioral patterns with lots of momentum that may not be adaptive. It can be quite painful to go through all this repression coming up while seeing yourself metabolizing it, noticing the forces of delusion operating, k..."},{"q":"How did you eventually become a teacher?","tags":["angelo-story","teaching","emergence"],"a":"After about 15 years of living silently in realization, I started noticing people would start waking up around me. I wouldn't try to bring up spiritual topics, but something about conversations would go a certain way, and people started waking up. I started meeting people all over the place who were waking up. It became clear there was something to point to, something to offer."},{"q":"What do you mean when you say \"anyone can awaken\"?","tags":["awakening","accessibility","who-can-awaken"],"a":"I'm absolutely certain that anyone walking the face of the Earth can experience that first big shift of awakening if they're genuinely interested. Deeper stages may vary. But awakening isn't the best thing for everyone. The best thing is what your intuition says is the best thing. If you're passionate about being the best father, that's your realization."},{"q":"Will meditation alone wake you up?","tags":["meditation","practice","barriers"],"a":"No. You can meditate for 30 years and not wake up if you aren't oriented toward it. Meditation calms the nervous system, dissolves fixations, but it's not equivalent to awakening. Even intense Zen sesshins\u2014meditating 14 hours a day in painful rigid posture\u2014won't wake you up without your own intuitive orientation."},{"q":"What's the relationship between trust and awakening?","tags":["surrender","trust","intention"],"a":"There's a strange place where human will meets complete surrender. It's \"Dammit, I'm gonna make this happen\" meeting \"I can't make anything happen, but life can make amazing things happen right now.\" And you let go into that\u2014that's when awakening happens. I've watched this clockwork process many times. It's totally natural."},{"q":"Is awakening becoming mainstream?","tags":["mainstream","culture","accessibility"],"a":"Meditation and mindfulness were taboo 20-30 years ago and are now taught in hospitals, schools, churches everywhere. Awakening is not a technique or practice\u2014it's a possibility and eventuality that meditation can open you to. More and more people are waking up, and faster. I believe it will become pretty much a mainstream thing in the next 10-20 years."},{"q":"What's your relationship to spiritual teaching now?","tags":["teaching","post-awakening","non-duality"],"a":"I have no philosophical or cognitive interest in spirituality. I'm only interested in people's direct experience right now, or what my experience is. If that helps point someone, great. But I don't care about terminology or how my experience compares to this buddhist sect or that philosophy. It's all just pointing to the same thing that's already obvious."}],"vid":"l2LZvO9wotM"},{"id":17,"title":"Buddha at the Gas Pump","series":"","source":"Buddha at the Gas Pump (BATGAP)","youtube":"https://www.youtube.com/watch?v=isCKesvjtNw","summary":"Angelo DiLullo, an anesthesiologist from Denver, joins Rick Archer for a two-hour in-depth conversation about awakening, the nature of consciousness, and post-awakening refinement. Angelo shares his personal story of intense childhood suffering, years of Transcendental Meditation, and a dramatic two-phase awakening that dissolved his sense of identity at age 24. He describes the difference between peak experiences and permanent realization, explores the subtractive nature of awakening (losing filters rather than gaining abilities), and addresses the challenge of working with intense emotions after awakening. The conversation covers practical non-dual inquiry, the relationship between meditation and awakening, how to navigate the \"dark night\" after realization, and the future mainstreaming of awakening in human consciousness.","qas":[{"q":"What led to your awakening? What was your life like before?","tags":["angelo-story","suffering","personal-history"],"a":"Intense internal suffering began in childhood when thoughts started crowding and suffocating his natural presence. By his late teens he felt something fundamentally wrong, though his external life seemed fine. At 19, he learned Transcendental Meditation from an old hippie (Robert Kragle) who'd studied with Maharishi in India."},{"q":"What's the difference between awakening and a peak/mystical experience?","tags":["awakening","peak-experience","core-concept"],"a":"A peak or mystical experience comes and goes\u2014it's an experience you have. Awakening is not an experience; it's recognizing how reality fundamentally is. It's self-validating and irreversible in a way that peak experiences are not. You can't turn it off. Peak experiences require the mind's buy-in and effort to construct; awakening requires no buy-in\u2014it just is this way."},{"q":"Will meditation alone wake you up?","tags":["meditation","practice","limitations"],"a":"No. You can meditate for 30 years and never awaken without the right orientation. Meditation calms the nervous system and softens fixations, but it's not equivalent to awakening. Even intense Zen sesshins\u2014meditating 14 hours a day in painful posture\u2014won't guarantee it. Pain doesn't wake you up (marathoners and laboring mothers would all be enlightened)."},{"q":"How did you develop your self-inquiry practice?","tags":["self-inquiry","practice","technique"],"a":"I became fascinated by what a thought actually is while meditating. I realized all of my perceived life\u2014problems, past, future\u2014was only accessible as thought when sitting with eyes closed. So I got close to thoughts like pixels on a screen, noticing each one arising. I'd recognize \"Oh, that's a thought\" and wait for the next movement of mind."},{"q":"What exactly happens to identity and personal preference after awakening?","tags":["no-self","identity","ego"],"a":"Yes, there's still preference. I prefer Mexican food to gravel. But it's based on a reflection in thought\u2014looking back at patterns\u2014not felt as something an \"I\" is pushing to achieve. Choices still happen, but there's nobody that feels like they're pushing and pulling on preferences. It's like the whole environment makes the choice."},{"q":"Can anyone wake up?","tags":["accessibility","who-can-awaken"],"a":"Probably anybody can experience the first big shift of awakening if they're genuinely interested. But I don't say \"everyone needs to wake up\" because that adds judgment. Some people know they're not ready\u2014and that's okay. I don't see anyone as \"asleep\"; I see people at different points. But if you're suffering and awakening speaks to you, yes, there's a way out."},{"q":"What are the stages after the initial awakening?","tags":["stages","post-awakening","integration"],"a":"First comes the honeymoon period\u2014usually months, sometimes two years\u2014where you feel enlightened, boundless, non-dual. Then confusion strikes: you start feeling things more intensely, especially emotions, and the mind interprets this as worse than before."},{"q":"How do you work with emotions after awakening?","tags":["emotions","shadow-work","practice"],"a":"Instead of being caught in the story about emotion, feel it directly in the body. Say to the fear or anger: \"You're accepted. Stay as long as you like. You're supposed to be here.\" This shifts it from narrative to direct physical sensation. Most people repress emotions by going into intellect to escape feeling."},{"q":"What about equanimity and reactivity?","tags":["equanimity","practice","integration"],"a":"There's a persistent feeling of equanimity\u2014nothing matters less or more, everything is exactly as it should be. Yet you care deeply about family, health, the world. The difference is you don't feel contracted when things don't go your way. This doesn't mean laziness; if anything, more gets accomplished because there's no fixation on outcomes."},{"q":"How does awakening affect perception, especially visual experience?","tags":["perception","sensory","non-duality"],"a":"In the pure sense fields, there's no subject-object division\u2014just sound sounding, color coloring, sensation happening. Most people can't maintain this because the dualistic mind re-creates filters and distance. But as consciousness stabilizes and identity dissolves, the visual field becomes non-dualistic. Distance becomes a thought-construct, not an actual feature."},{"q":"How does awakening affect your medical practice as an anesthesiologist?","tags":["work","accessibility","integration"],"a":"It makes focus easier because there's no background mental chatter about what's next or what I'm hungry for. It's quite enjoyable. I don't have to suppress or manage my mind; it's just naturally quiet. Regarding sensory perceptions (distance, depth), these do shift somewhat initially, but most people adapt."},{"q":"What about compassion and love after awakening?","tags":["compassion","love","post-awakening"],"a":"Compassion evolved in phases. Early on, I felt such opening that I wanted to fly to Ukraine or disaster zones, forgetting my immediate responsibilities. Later, paradoxically, the worry disappeared, but presence became the most compassionate act I could offer. I'm not preoccupied with distant events; I'm fully present with what's in front of me."},{"q":"Is awakening fundamentally paradoxical?","tags":["paradox","core-concept","integration"],"a":"Yes, completely. It's miraculous and normal. It's nothing special happening and the most radiant luminous experience. I'm a regular guy\u2014I work, date, take vacations\u2014but moment to moment I'm in a conversation with someone waking up, there's an energetic unraveling that's indescribable yet ordinary. There's no self yet choices happen. There's no time yet plans are made."},{"q":"What's the relationship between pure consciousness and the \"I am\" sense?","tags":["consciousness","i-am","core-concept"],"a":"When I use \"pure consciousness\" I mean an experiential designation, not metaphysical. Some people describe it as the pure \"I am\" sense\u2014undeniable, primary knowing. Others call it pure being. I use consciousness because you typically enter this through the thought-space\u2014you're investigating thinking itself and it opens to something unbound, not divided by subject, object, or thinker and thought...."},{"q":"What about God, death, and reincarnation?","tags":["spirituality","transcendence","mystery"],"a":"God: investigate what \"God\" means to you directly. Don't settle for concepts. Feel into it, surrender into it, beyond thoughts and ideas. Use it as a koan. Death: my experience is that true death is here constantly. This moment never comes back. There's a living death, a preciousness. Death and birth aren't separate\u2014see clearly through experience that they're one thing."}],"vid":"isCKesvjtNw"},{"id":18,"title":"Self-Inquiry: The I Am Sense","series":"","source":"Simply Always Awake \u2014 YouTube","youtube":"https://www.youtube.com/watch?v=LTIxoBakezg","summary":"Angelo delivers a guided, contemplative teaching on the \"I am\" sense\u2014the most fundamental experience of being before identity attaches to concepts or thoughts. He emphasizes that the \"I am\" sense is not a thought, idea, or perceptual shift, but rather the closest, most intimate experience of pure awareness itself. The teaching is dense with direct pointing language: Angelo invites listeners to stop seeking intellectually and instead inhabit their own being. He describes qualities of the \"I am\" sense (boundlessness, oceanic presence, neutral equanimity, paradoxical stillness and movement) while repeatedly warning that these descriptions should not become mental concepts to grasp. This is a teaching designed to short-circuit the seeking mind and point directly to what is already present.","qas":[{"q":"What is meant by: The I Am Sense Is Not Thought?","tags":["self-inquiry","core-concept","i-am"],"a":"First, distinguish what I'm pointing to from what you think it is. The \"I am\" sense is an experience, not a thought or concept called \"I am.\" When you awaken, you realize the pure sense of being as your most fundamental identity\u2014not the one practicing or seeking, but what's primary to that. This sense of pure being cannot be found through thinking."},{"q":"What does Angelo teach about simplicity and closeness make it hard to see?","tags":["barriers","self-inquiry","attention"],"a":"The \"I am\" sense is so simple and so close that its very simplicity makes it challenging to recognize. We're habituated to seeking something distant, something we need to discover or learn or gain. But what I'm pointing to is primary to the seeking itself. It's that which is always aware, regardless of whether there's thought or not."},{"q":"What Is Actually at the Center of You?","tags":["core-concept","presence","direct-pointing"],"a":"What is right at the center of you right now? I don't mean think about it. I mean inhabit it. See that you've never not inhabited this. It's a stopping\u2014stop moving forward, stop grasping for thoughts, stop grasping for what you think \"I am\" is because that's a thought. I'm pointing to that which is perceiving the thought."},{"q":"What does Angelo teach about pure knowing without object or knower?","tags":["consciousness","experience","i-am"],"a":"I'm pointing to the sense of you, or from your perspective, the sense of I. Let the concept of \"I\" go. The mind will try to think about this\u2014\"I think I got it\" or \"I'm not sure.\" But sit back into the one that's aware of those thoughts, the one not defined by them, not contingent upon them. It's complete rest. It's the sense of being you. It's what's paying attention to these words."},{"q":"What does Angelo teach about boundlessness as experience, not concept?","tags":["non-duality","perception","experience"],"a":"I can describe some qualities, but these descriptions are not something to think about. They're to be surmised or noticed. Don't look for them; don't test your experience against what I said. One quality is boundlessness\u2014there's no boundary inside or outside. It's just this: pure aware knowing. That knowing is possible. It's the pure knowing of being as you are right now."},{"q":"What is meant by: The Paradox of Still and Moving?","tags":["paradox","i-am","experience"],"a":"The \"I am\" sense is paradoxically still and moving simultaneously. There's a sort of scintillating or flowing experiential component, and there's also deep pervasive stillness. If that ties your mind up, fall back into the sense of being without qualifying what you are, without trying to think about yourself. Just feel into it."},{"q":"What does Angelo teach about instructions for resting in the i am sense?","tags":["practice","technique","self-inquiry"],"a":"With thoughts, you can let go of those thoughts and just rest here. Don't think \"I am.\" Don't think \"I.\" Don't think anything. Just be that pure experience that you could never not be. Let the words go. You don't think about the \"I am\" sense; you inhabit it."}],"vid":"LTIxoBakezg"},{"id":19,"title":"Alma Returns (No-Self)","series":"","source":"Simply Always Awake \u2014 YouTube","youtube":"https://www.youtube.com/watch?v=4AqqR7BqDX0","summary":"Angelo welcomes back Alma for a continuation of their exploration into no-self, consciousness, and the mechanisms of thought and reactivity. Alma shares her experience of thoughts as inert, without engagement or reactivity, and how this relates to the dissolution of self. The dialogue probes what happens when reactivity stops\u2014thoughts may still occur but without the entanglement that makes them seem real and binding. They explore Buddhism's understanding of consciousness as a distorted reflection, examine how the sense fields (hearing, seeing, sensation) operate without subject-object division, and distinguish between the reflexive nature of consciousness and the seamless nature of direct sensory experience. Angelo clarifies that consciousness itself is not the same as no-self realization, and that identification with consciousness is what must dissolve for true liberation.","qas":[{"q":"What is your current experience of thought?","tags":["no-self","thoughts","experience"],"a":"When there's thought, it doesn't matter whether thought is there or not. There's no engagement, no entanglement, no fear or reactivity toward thought. A thought is just an inert experience. When reactivity disappears completely, thoughts could still be there, but without the reactivity they're different\u2014almost imperceptible. There's no will, no pushing and pulling."},{"q":"Is reactivity the root cause of thought?","tags":["reactivity","consciousness","mechanism"],"a":"Looking closely at the mechanism: reactivity in the space of thought is what causes a thought to even appear in one sense. If there's no reactivity, there's no pushing and pulling, and it becomes extremely neutral. This is perhaps what people mean by \"no thought\"\u2014but consciousness and reflexive experience still remain. That's not the same as self."},{"q":"How does suffering relate to reactivity?","tags":["suffering","reactivity","no-self"],"a":"There was a sense that reactivity must be happening compulsively, that it must happen. Then it stopped somehow, and it seemed that it doesn't have to happen. It doesn't have to, and it was never really happening. It never had any real effect on anything."},{"q":"What exactly stops when the reactivity ceases?","tags":["no-self","cessation","realization"],"a":"Almost everything stops in one way. Some kind of fundamental belief stops. The believing itself stops. Reacting and buying into the whole system, anything that can construct an identity\u2014it just stops. The need for a world, the need for an outer world or an inner world, the need for division between them or between anything. The need to hold on to or define a boundary."},{"q":"How do you investigate the sensory fields directly?","tags":["perception","sensory","direct-experience"],"a":"In the sense fields, in the pure sense fields, there's no sense of any division anywhere. There's no subject-object processing, no time gap in which anything can happen. There's no time gap in which an inner world can construct or in which a sense of agency can form at all. It's seamless reality. When you look at a visual experience, there's a sense field with color and form."},{"q":"Is consciousness the same as no-self?","tags":["consciousness","no-self","distinction"],"a":"There's definitely consciousness, but the identification with consciousness stops. The belief that there needs to be consciousness at all stops. There's inherent value to consciousness, or identity to consciousness, or truth or will or impulse\u2014all that gets drained out of consciousness, and it's seen to be just another sense or reflective in nature. That's all that it is. Nothing more."},{"q":"What is consciousness from the Buddhist perspective?","tags":["consciousness","buddhism","distortion"],"a":"According to Buddhism, consciousness is reflection of a sense, but it's an inherently distorting reflection. The distortion is through the sense of self or an underlying reactivity before self\u2014a tendency to react to experience. But the experience is only thought-based in the cognitive realm. In the pure sense fields, there's no such distortion."},{"q":"What is the relationship between reactivity and the illusion of gap?","tags":["time","self","illusion"],"a":"The gap is what allows for distortion, and it's not really there. It's an activity that's constantly creating a sense of the gap, but that sense never becomes anything real, never becomes a separate self. It's just a constant activity. That's why reactivity is such a good word for it\u2014because it's just reactivity constantly happening. So then it maybe feels like a sense of self, but it's not."},{"q":"Can consciousness exist without reactivity?","tags":["consciousness","reactivity","experience"],"a":"There can be consciousness, yes. There's still reflective experience. But there's no reactivity in that space of thought, so it becomes extremely neutral. Without reactivity, there's no basis for comparison between the reflections and reality. Without the basis for comparison, the distortion isn't there."},{"q":"What makes the visual field harder to perceive as non-dual?","tags":["perception","visual","sensory"],"a":"Sound, sensation, and taste are easier to perceive as non-dual. But the visual field is trickier probably because of brain function. The occipital lobe uses the vast majority of oxygen and the thalamus projects information to it, but just as many neurons carry it back."}],"vid":"4AqqR7BqDX0"},{"id":20,"title":"How To Experience Non-Duality","series":"","source":"Simply Always Awake \u2014 YouTube","youtube":"https://www.youtube.com/watch?v=SZCjHj5fwsg","summary":"Angelo offers a direct, practical teaching on how to dissolve the filters that prevent non-dual experience. He emphasizes that non-duality is not a state to achieve or a place to merge with; it's already present when we stop filtering reality through thought. The teaching begins with the radical recognition that enlightenment \"just is\"\u2014there's no process of gaining or self-refinement involved. Angelo then guides listeners to experience non-dual perception by redirecting attention to raw sensory experience, especially the visual field, without conceptual overlay. He addresses common obstacles: the mind's tendency to label and categorize, the need to check in with thought to verify experience, and the impulse to qualify what you're experiencing as \"right\" or \"wrong.\" The teaching culminates in an invitation to let sensory awareness be primary while releasing the constant commentary and judgment of the thinking mind.","qas":[{"q":"What does Angelo teach about non-duality just is\u2014there's nothing to find?","tags":["non-duality","core-concept","awakening"],"a":"Enlightenment just is. It's the nature of reality. There's no one in it, no separate entity enjoying it. There's no one and nothing apart from raw unfiltered reality to observe it, categorize it, capture it, discuss it, or share it. This is not a process of self-refinement. It's not a process of gaining spiritual insights or finding your true nature."},{"q":"What does Angelo teach about non-dual experience is perceiving without separation?","tags":["non-duality","perception","filters"],"a":"Non-dual experience is not about merging with an object or finding a special state of unity. It's already here. Non-dual realization means seeing without the filters of separation, without the subject-object construct. Seeing in such a way that you forget what you thought you knew about the body, the mind, the objects of seeing, labels, distance, photons, retinas, optic nerves\u2014when you forget a..."},{"q":"What does Angelo teach about release your mental commentary about experience?","tags":["practice","technique","attention"],"a":"Your mind is constantly adding a story: how it is, why it is, where it is, what it means. When seeing just sees\u2014when there's just that visual non-dualistic experience\u2014then the sense of here and there collapses. They're not needed. You don't need to understand, label, or apply effort. You don't need to meditate for seeing to see. It's always this way. So just allow the seeing to be what it is."},{"q":"What does Angelo teach about periodically return attention to sensory experience?","tags":["practice","attention","direct-pointing"],"a":"You may have to tune into colors, forms, and shapes periodically to remind yourself not to rest in thought. But once you redirect attention to the visual experience, just stay there. Don't come back home to thought-space to register that you're doing okay. You don't need to check in to make sure you're experiencing something special."},{"q":"What does Angelo teach about ask the right questions to bypass conceptual mind?","tags":["inquiry","practice","direct-experience"],"a":"Ask yourself questions, but reference only the visual experience for the answer, not a word answer. \"Is it close or far?\" Reference only the visual experience. \"Is it small or large?\" \"Is it here or there?\" \"Is it bright or dim?\" \"Is it self or other?\" The answer to all of these is just the raw visual experience itself. Any other answer is a thought\u2014discard it."},{"q":"What is meant by: The Intimacy of Non-Duality?","tags":["non-duality","intimacy","experience"],"a":"The intimacy is recognizing that when we don't make distance, it's just as much inside as outside, and inside and outside lose meaning because they're the same thing. But even that is saying too much. There's only this\u2014only this intimate, non-separated, non-divided experience. Seeing sees. Not happening to someone. Not happening for a purpose. Not coming or going. Just this."},{"q":"What is meant by: The Practice Is Not Complicated?","tags":["practice","simplicity","non-duality"],"a":"This practice is not complicated. We can complicate it with our mind, but when we remind ourselves we don't need to return home to the safety of mind, we can just stay in the experience, then it becomes very, very simple. It's not about achieving a state or fixing yourself. It's about allowing what's already here to be primary."}],"vid":"SZCjHj5fwsg"}];
