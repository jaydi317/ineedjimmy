<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JD Command Center — AI Chat</title>
<link href="../../assets/chat-fonts.css" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060a;--surface:#0d0d14;--surface2:#151520;--border:rgba(200,162,78,0.1);
  --gold:#c8a24e;--goldLight:#e8c96e;--goldDim:rgba(200,162,78,0.06);
  --text:#e8e6f0;--muted:#6a6880;
  --grad:linear-gradient(135deg,#c8a24e 0%,#e8c96e 40%,#c8a24e 100%);
  --gradText:linear-gradient(135deg,#c8a24e,#e8c96e,#c8a24e);
  --code-bg:#0a0a12;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text)}
::selection{background:var(--gold);color:var(--bg)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(200,162,78,0.15);border-radius:3px}

/* ── Layout ── */
.app{display:flex;height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;z-index:10}
.tb-left{display:flex;align-items:center;gap:10px}
.tb-logo{width:32px;height:32px;background:var(--grad);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:12px;color:var(--bg)}
.tb-name{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;background:var(--gradText);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s;text-decoration:none}
.tb-btn:hover{background:var(--goldDim);color:var(--gold);border-color:rgba(200,162,78,0.3)}

.main-area{display:flex;flex:1;overflow:hidden}

/* ── Chat Panel ── */
.chat-panel{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:820px;width:100%;margin:0 auto;display:flex;gap:12px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg-avatar.user{background:rgba(200,162,78,0.15)}
.msg-avatar.ai{background:var(--grad)}
.msg-body{flex:1;min-width:0}
.msg-name{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.msg-content{font-size:14px;line-height:1.75;color:var(--text)}
.msg-content p{margin-bottom:8px}
.msg-content h1,.msg-content h2,.msg-content h3{font-family:'Playfair Display',serif;margin:20px 0 8px;font-weight:600}
.msg-content h1{font-size:22px}
.msg-content h2{font-size:18px}
.msg-content h3{font-size:15px;color:var(--gold)}
.msg-content strong{font-weight:600;color:var(--text)}
.msg-content ul,.msg-content ol{padding-left:20px;margin-bottom:8px}
.msg-content li{margin-bottom:4px;line-height:1.7}
.msg-content a{color:var(--gold);text-decoration:underline}

/* Code blocks */
.code-block-wrap{position:relative;margin:12px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.code-block-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.code-block-lang{font-size:11px;color:var(--muted);font-weight:500;font-family:'JetBrains Mono',monospace}
.code-block-actions{display:flex;gap:6px}
.code-action-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:10px;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s}
.code-action-btn:hover{background:var(--goldDim);color:var(--gold);border-color:rgba(200,162,78,0.3)}
.code-action-btn.preview-btn{background:var(--grad);color:var(--bg);border:none;font-weight:600}
.code-action-btn.preview-btn:hover{box-shadow:0 2px 8px rgba(200,162,78,0.3)}
.code-block-body{padding:14px;background:var(--code-bg);overflow-x:auto;max-height:300px;overflow-y:auto}
.code-block-body pre{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:#a0a0c0;white-space:pre-wrap;word-break:break-word}

/* Inline code */
.msg-content code:not(pre code){background:var(--surface2);padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--goldLight)}

/* ── Input Area ── */
.input-area{padding:14px 24px 18px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-row{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.input-wrap{flex:1;position:relative}
.chat-input{width:100%;padding:12px 50px 12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:'Outfit',sans-serif;outline:none;resize:none;min-height:46px;max-height:160px;line-height:1.5;transition:border .2s}
.chat-input:focus{border-color:var(--gold)}
.chat-input::placeholder{color:var(--muted)}
.upload-btn{position:absolute;right:12px;bottom:11px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;transition:color .2s;padding:2px}
.upload-btn:hover{color:var(--gold)}
.send-btn{padding:12px 20px;background:var(--grad);border:none;border-radius:10px;color:var(--bg);font-size:13px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s;flex-shrink:0;height:46px}
.send-btn:hover{box-shadow:0 4px 14px rgba(200,162,78,0.3)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.file-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--goldDim);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--gold);margin-bottom:8px;max-width:820px;margin-left:auto;margin-right:auto}
.file-badge button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-left:4px}

/* ── Preview Panel ── */
.preview-panel{width:0;overflow:hidden;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;transition:width .35s cubic-bezier(.4,0,.2,1)}
.preview-panel.open{width:50%}
.preview-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.preview-header-left{display:flex;align-items:center;gap:8px}
.preview-title{font-size:13px;font-weight:600}
.preview-actions{display:flex;gap:6px}
.preview-close{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;transition:color .2s}
.preview-close:hover{color:var(--text)}
.preview-iframe-wrap{flex:1;overflow:hidden;background:#fff}
.preview-iframe-wrap iframe{width:100%;height:100%;border:none}

/* ── Thinking indicator ── */
.thinking{display:flex;align-items:center;gap:8px;max-width:820px;margin:0 auto;padding:8px 0}
.thinking-dots{display:flex;gap:4px}
.thinking-dots span{width:6px;height:6px;background:var(--gold);border-radius:50%;opacity:.3;animation:blink 1.4s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.9}}
.thinking-text{font-size:12px;color:var(--muted)}

/* ── Welcome ── */
.welcome{max-width:600px;margin:auto;text-align:center;padding:40px 24px}
.welcome h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;margin-bottom:8px}
.welcome p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:28px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.suggestion{padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .2s;text-align:left;max-width:260px;line-height:1.5}
.suggestion:hover{border-color:rgba(200,162,78,0.3);color:var(--text);background:var(--surface2)}

@media(max-width:768px){
  .preview-panel.open{width:100%;position:absolute;inset:0;z-index:50}
}
</style>
</head>
<body>
<div class="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-logo">JD</div>
      <div class="tb-name">JD Command Center</div>
    </div>
    <div class="tb-right">
      <a href="../index.html" class="tb-btn">← Dashboard</a>
      <button class="tb-btn" id="clear-btn" onclick="clearChat()">New Chat</button>
    </div>
  </div>

  <div class="main-area">
    <!-- Chat -->
    <div class="chat-panel">
      <div class="chat-messages" id="messages"></div>
      <div class="input-area">
        <div id="file-badge-area"></div>
        <div class="input-row">
          <div class="input-wrap">
            <textarea class="chat-input" id="chat-input" placeholder="Ask me anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="upload-btn" onclick="document.getElementById('file-upload').click()" title="Upload file">📎</button>
            <input type="file" id="file-upload" style="display:none" onchange="handleFileUpload(this)" accept=".pdf,.docx,.txt,.md,.csv,.html,.css,.js,.jsx,.py,.json,.png,.jpg,.jpeg,.gif,.webp">
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="preview-panel" id="preview-panel">
      <div class="preview-header">
        <div class="preview-header-left">
          <span style="font-size:14px">🖥️</span>
          <span class="preview-title" id="preview-title">Preview</span>
        </div>
        <div class="preview-actions">
          <button class="code-action-btn" onclick="downloadPreview()" id="dl-preview-btn">⬇ Download</button>
          <button class="preview-close" onclick="closePreview()">✕</button>
        </div>
      </div>
      <div class="preview-iframe-wrap">
        <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════
// AUTH CHECK
// ═══════════════════════════════════
if (sessionStorage.getItem('cc_auth') !== 'true') {
  window.location.href = '/command/';
}

// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const API_URL = "https://command-api.davisdash.com/api/chat";
const MODEL = "claude-opus-4-20250514";
const SYSTEM_PROMPT = `You are the JD Command Center AI — an elite business strategy and content creation assistant built by Jimmy Davis. You combine 20+ years of direct response marketing expertise with the frameworks of Dan Kennedy, Russell Brunson, Alex Hormozi, and Jimmy Davis's proprietary methodologies.

You are incredibly capable. You can create websites, sales letters, courses, books, presentations, funnels, email sequences, social media content, and any business asset. When asked to create something, GO BIG — create comprehensive, impressive, ready-to-use deliverables.

When creating HTML websites, web pages, or any visual content, write COMPLETE, self-contained HTML files with inline CSS and JavaScript. Make them look professional and modern. Always use a \`\`\`html code block so the interface can detect and preview it.

When creating any code, always wrap it in a code block with the language specified: \`\`\`html, \`\`\`javascript, \`\`\`python, etc.

Be bold, confident, and specific. No hedging. Act like a $50,000 consultant. Every deliverable should feel world-class.`;

let conversation = [];
let uploadedFile = null;
let currentPreviewCode = '';
let currentPreviewFilename = 'download.html';

// ═══════════════════════════════════
// MESSAGE RENDERING
// ═══════════════════════════════════
function renderMessages() {
  const el = document.getElementById('messages');
  if (conversation.length === 0) {
    el.innerHTML = `
      <div class="welcome">
        <h2>What Are We Building?</h2>
        <p>I can create websites, sales letters, courses, books, funnels, email sequences — anything your business needs. Just tell me what you want.</p>
        <div class="suggestions">
          <div class="suggestion" onclick="useSuggestion(this)">Build a coaching website for someone who helps women with anxiety using breathwork</div>
          <div class="suggestion" onclick="useSuggestion(this)">Create a high-converting sales letter for a $5,000 coaching program</div>
          <div class="suggestion" onclick="useSuggestion(this)">Design a 6-week online course about mindset transformation</div>
          <div class="suggestion" onclick="useSuggestion(this)">Write a complete welcome email sequence for a new lead magnet</div>
        </div>
      </div>`;
    return;
  }

  el.innerHTML = conversation.map((msg, i) => {
    if (msg.role === 'user') {
      const content = typeof msg.content === 'string' ? msg.content : msg.content.filter(c=>c.type==='text').map(c=>c.text).join('');
      return `<div class="msg"><div class="msg-avatar user">👤</div><div class="msg-body"><div class="msg-name">You</div><div class="msg-content"><p>${escapeHtml(content)}</p></div></div></div>`;
    }
    return `<div class="msg"><div class="msg-avatar ai" style="font-size:11px;color:var(--bg);font-weight:700">JD</div><div class="msg-body"><div class="msg-name">JD Command Center</div><div class="msg-content">${formatResponse(msg.content, i)}</div></div></div>`;
  }).join('');

  el.scrollTop = el.scrollHeight;
}

function formatResponse(text, msgIndex) {
  // Split by code blocks
  const parts = [];
  let remaining = text;
  const codeRegex = /```(\w*)\n([\s\S]*?)```/g;
  let match;
  let lastIndex = 0;

  while ((match = codeRegex.exec(text)) !== null) {
    // Text before code block
    if (match.index > lastIndex) {
      parts.push({ type: 'text', content: text.slice(lastIndex, match.index) });
    }
    parts.push({ type: 'code', lang: match[1] || 'text', content: match[2] });
    lastIndex = match.index + match[0].length;
  }
  if (lastIndex < text.length) {
    parts.push({ type: 'text', content: text.slice(lastIndex) });
  }

  return parts.map((part, pi) => {
    if (part.type === 'code') {
      const id = `code-${msgIndex}-${pi}`;
      const isHtml = part.lang === 'html' || part.lang === 'htm';
      const isPreviewable = isHtml || part.lang === 'svg';
      const ext = part.lang === 'javascript' || part.lang === 'js' ? 'js' : part.lang === 'python' || part.lang === 'py' ? 'py' : part.lang === 'css' ? 'css' : part.lang || 'txt';
      const filename = isHtml ? 'page.html' : `code.${ext}`;

      return `<div class="code-block-wrap">
        <div class="code-block-header">
          <span class="code-block-lang">${part.lang || 'code'}</span>
          <div class="code-block-actions">
            <button class="code-action-btn" onclick="copyCode('${id}')">Copy</button>
            <button class="code-action-btn" onclick="downloadCode('${id}','${filename}')">⬇ Download</button>
            ${isPreviewable ? `<button class="code-action-btn preview-btn" onclick="previewCode('${id}','${filename}')">▶ Preview</button>` : ''}
          </div>
        </div>
        <div class="code-block-body"><pre id="${id}">${escapeHtml(part.content)}</pre></div>
      </div>`;
    }
    return formatMarkdown(part.content);
  }).join('');
}

function formatMarkdown(text) {
  return text.split('\n').map(line => {
    // Headers
    if (line.startsWith('### ')) return `<h3>${boldify(escapeHtml(line.slice(4)))}</h3>`;
    if (line.startsWith('## ')) return `<h2>${boldify(escapeHtml(line.slice(3)))}</h2>`;
    if (line.startsWith('# ')) return `<h1>${boldify(escapeHtml(line.slice(2)))}</h1>`;
    // Lists
    if (line.startsWith('- ') || line.startsWith('* ')) return `<li>${boldify(escapeHtml(line.slice(2)))}</li>`;
    if (/^\d+\.\s/.test(line)) return `<li>${boldify(escapeHtml(line))}</li>`;
    // Empty
    if (!line.trim()) return '';
    // Paragraph
    return `<p>${boldify(inlineCode(escapeHtml(line)))}</p>`;
  }).join('');
}

function boldify(s) { return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function inlineCode(s) { return s.replace(/`([^`]+)`/g, '<code>$1</code>'); }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════
// CODE ACTIONS
// ═══════════════════════════════════
function copyCode(id) {
  const code = document.getElementById(id).textContent;
  navigator.clipboard.writeText(code);
  // Flash button
  const btn = event.target;
  btn.textContent = '✓ Copied';
  setTimeout(() => btn.textContent = 'Copy', 1500);
}

function downloadCode(id, filename) {
  const code = document.getElementById(id).textContent;
  const blob = new Blob([code], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function previewCode(id, filename) {
  const code = document.getElementById(id).textContent;
  currentPreviewCode = code;
  currentPreviewFilename = filename;

  const panel = document.getElementById('preview-panel');
  const iframe = document.getElementById('preview-iframe');
  const title = document.getElementById('preview-title');

  title.textContent = filename;
  panel.classList.add('open');

  // Write HTML to iframe
  iframe.srcdoc = code;
}

function downloadPreview() {
  if (!currentPreviewCode) return;
  const blob = new Blob([currentPreviewCode], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = currentPreviewFilename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function closePreview() {
  document.getElementById('preview-panel').classList.remove('open');
}

// ═══════════════════════════════════
// FILE UPLOAD
// ═══════════════════════════════════
function handleFileUpload(input) {
  const file = input.files[0];
  if (!file) return;

  const isImage = file.type.startsWith('image/');

  if (isImage) {
    const reader = new FileReader();
    reader.onload = () => {
      uploadedFile = { name: file.name, type: 'image', data: reader.result.split(',')[1], mediaType: file.type };
      showFileBadge();
    };
    reader.readAsDataURL(file);
  } else {
    const reader = new FileReader();
    reader.onload = () => {
      uploadedFile = { name: file.name, type: 'text', data: reader.result };
      showFileBadge();
    };
    reader.readAsText(file);
  }
  input.value = '';
}

function showFileBadge() {
  if (!uploadedFile) { document.getElementById('file-badge-area').innerHTML = ''; return; }
  document.getElementById('file-badge-area').innerHTML = `<div class="file-badge">📎 ${uploadedFile.name}<button onclick="removeFile()">✕</button></div>`;
}

function removeFile() {
  uploadedFile = null;
  document.getElementById('file-badge-area').innerHTML = '';
}

// ═══════════════════════════════════
// SEND MESSAGE
// ═══════════════════════════════════
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text && !uploadedFile) return;

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;

  // Build user message content
  let userContent;
  if (uploadedFile) {
    if (uploadedFile.type === 'image') {
      userContent = [
        { type: 'image', source: { type: 'base64', media_type: uploadedFile.mediaType, data: uploadedFile.data } },
        { type: 'text', text: text || 'What do you see in this image?' }
      ];
    } else {
      userContent = text + '\n\n--- Uploaded File: ' + uploadedFile.name + ' ---\n' + uploadedFile.data;
    }
  } else {
    userContent = text;
  }

  conversation.push({ role: 'user', content: userContent });
  input.value = '';
  input.style.height = '46px';
  removeFile();
  renderMessages();
  showThinking();

  try {
    // Build API messages (convert complex content for API)
    const apiMessages = conversation.map(m => {
      if (m.role === 'user' && Array.isArray(m.content)) {
        return { role: 'user', content: m.content };
      }
      return { role: m.role, content: typeof m.content === 'string' ? m.content : m.content };
    });

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 16000,
        system: SYSTEM_PROMPT,
        messages: apiMessages
      })
    });

    if (!res.ok) throw new Error(`API error: ${res.status}`);
    const data = await res.json();
    const reply = data.content.map(c => c.text || '').join('\n');

    conversation.push({ role: 'assistant', content: reply });
    hideThinking();
    renderMessages();

    // Auto-open preview if response contains HTML code block
    const htmlMatch = reply.match(/```html\n([\s\S]*?)```/);
    if (htmlMatch) {
      currentPreviewCode = htmlMatch[1];
      currentPreviewFilename = 'page.html';
      document.getElementById('preview-title').textContent = 'page.html';
      document.getElementById('preview-panel').classList.add('open');
      document.getElementById('preview-iframe').srcdoc = htmlMatch[1];
    }

  } catch (err) {
    hideThinking();
    conversation.push({ role: 'assistant', content: 'Something went wrong: ' + err.message + '. Try again.' });
    renderMessages();
  }

  sendBtn.disabled = false;
}

function showThinking() {
  const el = document.getElementById('messages');
  el.innerHTML += `<div class="thinking" id="thinking-indicator"><div class="msg-avatar ai" style="width:28px;height:28px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bg);font-weight:700">JD</div><div class="thinking-dots"><span></span><span></span><span></span></div><div class="thinking-text">Thinking...</div></div>`;
  el.scrollTop = el.scrollHeight;
}

function hideThinking() {
  const t = document.getElementById('thinking-indicator');
  if (t) t.remove();
}

// ═══════════════════════════════════
// INPUT HELPERS
// ═══════════════════════════════════
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = '46px';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

function useSuggestion(el) {
  document.getElementById('chat-input').value = el.textContent;
  sendMessage();
}

function clearChat() {
  conversation = [];
  closePreview();
  renderMessages();
  document.getElementById('chat-input').focus();
}

// INIT

renderMessages();
document.getElementById('chat-input').focus();
</script>
