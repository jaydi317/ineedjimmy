<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="description" content="Explore six Mackmart homepage mockups.">
  <link rel="canonical" href="https://ineedjimmy.com/mackmart/">
  <title>Mackmart — Homepage mockups</title>
  <style>
    :root{color-scheme:light;--ink:#202323;--muted:#525858;--line:#d9dddd;--claret:#861d35;--paper:#fff;--preview:#f1f3f3}
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:18px;line-height:1.5;border-top:5px solid var(--claret)}
    main{max-width:1352px;margin:0 auto;padding:52px 36px 64px}
    header{margin-bottom:36px}
    h1{margin:0 0 8px;font-size:52px;line-height:1.1;letter-spacing:-.035em;font-weight:650;color:var(--claret)}
    header p{margin:0;font-size:21px;color:var(--muted)}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
    .mockup{display:block;min-width:0;color:inherit;text-decoration:none;border:1px solid var(--line);background:var(--paper)}
    .mockup:focus-visible{outline:4px solid var(--claret);outline-offset:5px}
    .mockup:hover .open{text-decoration:underline;text-underline-offset:4px}
    .preview{display:block;width:100%;height:auto;aspect-ratio:36/25;object-fit:contain;object-position:top;background:var(--preview);border-bottom:1px solid var(--line)}
    .caption{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:80px;padding:18px 20px}
    h2{margin:0;font-size:21px;line-height:1.3;font-weight:600;letter-spacing:-.02em}
    .open{font-size:17px;line-height:1.4;font-weight:500;color:var(--claret);white-space:nowrap}
    @media(max-width:1000px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:620px){body{font-size:17px}main{padding:32px 20px 44px}header{margin-bottom:28px}h1{font-size:42px}header p{font-size:19px}.gallery{grid-template-columns:minmax(0,1fr);gap:24px}.caption{padding:16px;min-height:76px}h2{font-size:20px}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mackmart</h1>
      <p>Explore six homepage mockups.</p>
    </header>
    <div class="gallery">
      <a class="mockup" href="mockup-1.html" aria-label="Open Mockup 1">
        <img class="preview" src="assets/preview-1.webp" alt="Homepage preview for Mockup 1" width="900" height="625">
        <div class="caption"><h2>Mockup 1</h2><span class="open">Open mockup</span></div>
      </a>
      <a class="mockup" href="mockup-2.html" aria-label="Open Mockup 2">
        <img class="preview" src="assets/preview-2.webp" alt="Homepage preview for Mockup 2" width="900" height="625">
        <div class="caption"><h2>Mockup 2</h2><span class="open">Open mockup</span></div>
      </a>
      <a class="mockup" href="mockup-3.html" aria-label="Open Mockup 3">
        <img class="preview" src="assets/preview-3.webp" alt="Homepage preview for Mockup 3" width="900" height="625">
        <div class="caption"><h2>Mockup 3</h2><span class="open">Open mockup</span></div>
      </a>
      <a class="mockup" href="mockup-4.html" aria-label="Open Mockup 4">
        <img class="preview" src="assets/preview-4.webp" alt="Homepage preview for Mockup 4" width="900" height="625">
        <div class="caption"><h2>Mockup 4</h2><span class="open">Open mockup</span></div>
      </a>
      <a class="mockup" href="mockup-5.html" aria-label="Open Mockup 5">
        <img class="preview" src="assets/preview-5.webp" alt="Homepage preview for Mockup 5" width="900" height="625">
        <div class="caption"><h2>Mockup 5</h2><span class="open">Open mockup</span></div>
      </a>
      <a class="mockup" href="mockup-6.html" aria-label="Open Mockup 6">
        <img class="preview" src="assets/preview-6.webp" alt="Homepage preview for Mockup 6" width="900" height="625">
        <div class="caption"><h2>Mockup 6</h2><span class="open">Open mockup</span></div>
      </a>
    </div>
  </main>
</body>
</html>
