<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teaser Collage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .canvas {
    width: 1080px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 24px;
  }

  .row {
    display: flex;
    gap: 14px;
  }

  .browser {
    flex: 1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 
      0 16px 50px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.06);
  }

  .browser-bar {
    height: 30px;
    background: linear-gradient(180deg, #2c2c2c 0%, #222 100%);
    display: flex;
    align-items: center;
    padding: 0 11px;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }

  .url-bar {
    flex: 1;
    margin-left: 10px;
    height: 18px;
    background: rgba(0,0,0,0.35);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .url-bar::after {
    content: '';
    position: absolute;
    top: 5px; left: 10px;
    width: 45%;
    height: 8px;
    background: rgba(255,255,255,0.07);
    border-radius: 4px;
    filter: blur(2px);
  }

  .browser img {
    width: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="canvas">

  <div class="row">
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar"></div>
      </div>
      <img src="img1.png" alt="">
    </div>
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar"></div>
      </div>
      <img src="img2.png" alt="">
    </div>
  </div>

  <div class="row">
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar"></div>
      </div>
      <img src="img3.png" alt="">
    </div>
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar"></div>
      </div>
      <img src="img4.png" alt="">
    </div>
  </div>

  <div class="row">
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar"></div>
      </div>
      <img src="img5.png" alt="">
    </div>
    <div class="browser">
      <div class="browser-bar">
        <div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div>
        <div class="url-bar"></div>
      </div>
      <img src="img6.png" alt="">
    </div>
  </div>

</div>
</body>
</html>
