*{margin:0;padding:0;box-sizing:border-box}
:root{

body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);border-bottom:1px solid var(--border);padding:24px 32px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px)}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.header h1 span{color:var(--accent2);font-weight:400}
.header .sub{color:var(--muted);font-size:13px;margin-top:4px}
.controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.controls button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:all .2s}
.controls button:hover,.controls button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.controls button.active-hot{background:var(--hot);border-color:var(--hot);color:#fff}
.controls button.active-warm{background:var(--warm);border-color:var(--warm);color:#000}
.stats{display:flex;gap:16px;padding:16px 32px;border-bottom:1px solid var(--border)}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 20px;flex:1;max-width:200px}
.stat .num{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace}
.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.stat.hot .num{color:var(--hot)}.stat.warm .num{color:var(--warm)}.stat.cool .num{color:var(--accent2)}
.main{padding:24px 32px;max-width:1400px}

.section-header .badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;font-family:'JetBrains Mono',monospace}

.badge-warm{background:var(--warm-bg);color:var(--warm);border:1px solid var(--warm-border)}
.badge-cool{background:var(--cool-bg);color:var(--cool);border:1px solid var(--cool-border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;transition:all .2s}
.card:hover{border-color:#334155;transform:translateY(-1px);box-shadow:0 4px 24px rgba(0,0,0,.3)}
.card.priority-hot{border-left:3px solid var(--hot)}
.card.priority-warm{border-left:3px solid var(--warm)}
.card.priority-cold{border-left:3px solid var(--accent2)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 20px 12px;cursor:pointer}
.card-top h3{font-size:15px;font-weight:600}
.card-top .meta{display:flex;gap:8px;align-items:center}
.card-top .tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tag-hot{background:var(--hot);color:#fff}.tag-warm{background:var(--warm);color:#000}.tag-cold{background:#334155;color:#94a3b8}
.card-body{padding:0 20px 16px;display:none}
.card.open .card-body{display:block}
.card-body .row{display:grid;grid-template-columns:140px 1fr;gap:8px;margin-bottom:10px;font-size:13px}
.card-body .row .label{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card-body .row .value{color:var(--text)}
.hook-box{background:#0c1425;border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin:12px 0;position:relative;font-size:13px;line-height:1.7}
.hook-box::before{content:'COLD CALL HOOK';position:absolute;top:-8px;left:12px;background:var(--accent);color:#fff;font-size:9px;padding:1px 8px;border-radius:3px;font-weight:700;letter-spacing:1px}
.contact-box{background:linear-gradient(135deg,rgba(6,182,212,.06),rgba(59,130,246,.06));border:1px solid rgba(6,182,212,.2);border-radius:8px;padding:14px 16px;margin:12px 0}
.contact-box h4{font-size:12px;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}
.contact-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.contact-item:last-child{border-bottom:none}
.contact-item .name{font-weight:600;font-size:14px}.contact-item .title{color:var(--muted);font-size:12px}
.contact-item .phone{font-family:'JetBrains Mono',monospace;color:var(--accent2);font-size:13px}
.btn-copy{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;transition:all .15s}
.btn-copy:hover{background:#2563eb;transform:scale(1.03)}
.btn-copy.copied{background:var(--cool)}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chevron{transition:transform .2s;color:var(--muted);font-size:18px}
.card.open .chevron{transform:rotate(90deg)}
.poc-badge{font-size:11px;background:rgba(59,130,246,.15);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:500}
.hidden{display:none!important}
.toast{position:fixed;bottom:24px;right:24px;background:var(--cool);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:768px){
.stats{flex-wrap:wrap}.stat{max-width:none;flex:1 1 45%}
.main{padding:16px}.card-body .row{grid-template-columns:1fr}
.controls{gap:6px}.controls button{padding:6px 10px;font-size:11px}
}
</style>

const m=sectionMeta[key];
const sec=document.createElement('div');
sec.innerHTML=`<div class="section-header"><h2>${m.label}</h2><span class="badge ${m.cls}">${items.length}</span></div>`;
items.forEach(a=>{
const card=document.createElement('div');
card.className=`card priority-${a.priority}`;
card.dataset.poc=a.poc;
card.dataset.priority=a.priority;
const tagCls=a.priority==='hot'?'tag-hot':a.priority==='warm'?'tag-warm':'tag-cold';
const tagText=a.priority==='hot'?'ACTIVE RFP':a.priority==='warm'?'TOP PRIORITY':'DEVELOPING';
card.innerHTML=`
<div class="card-top" onclick="this.parentElement.classList.toggle('open')">
<div><h3>${a.name}</h3><div style="display:flex;gap:6px;margin-top:4px"><span class="poc-badge">${a.poc}</span><span style="color:var(--muted);font-size:12px">${a.type} · ${a.hq}</span></div></div>
<div class="meta"><span class="tag ${tagCls}">${tagText}</span><span class="chevron">›</span></div>
</div>
<div class="card-body">
<div class="row"><div class="label">Capacity</div><div class="value">${a.constrained}</div></div>
<div class="row"><div class="label">Status</div><div class="value" style="color:${a.priority==='hot'?'var(--hot)':a.priority==='warm'?'var(--warm)':'var(--text)'};font-weight:600">${a.status}</div></div>
<div class="row"><div class="label">Portfolio</div><div class="value">${a.portfolio}</div></div>
<div class="row"><div class="label">Opportunity</div><div class="value">${a.opportunity}</div></div>
<div class="hook-box" id="hook-${a.name.replace(/[^a-zA-Z]/g,'')}">${a.hook}</div>
<div class="btn-row"><button class="btn-copy" onclick="copyText(\`${a.hook.replace(/`/g,"\\`")}\`,this)">📋 Copy Hook</button></div>
<div class="contact-box"><h4>Key Contacts</h4>${a.contacts.map(c=>`
<div class="contact-item"><div><div class="name">${c.name}</div><div class="title">${c.title}</div></div><div class="phone">${c.phone}</div></div>`).join('')}
</div>
</div>`;
sec.appendChild(card);
});
main.appendChild(sec);
});
if(!filtered.length){main.innerHTML='<p style="text-align:center;color:var(--muted);padding:60px">No accounts match this filter.</p>';}
}

function filterAll(btn){
currentFilter='all';currentPriority=null;
document.querySelectorAll('.controls button').forEach(b=>b.className='');
btn.className='active';render();
}
function filterPOC(btn,poc){
currentFilter=poc;currentPriority=null;
document.querySelectorAll('.controls button').forEach(b=>b.className='');
btn.className='active';render();
}
function filterPriority(btn,p){
currentPriority=p;currentFilter='all';
document.querySelectorAll('.controls button').forEach(b=>b.className='');
btn.className=p==='hot'?'active-hot':p==='warm'?'active-warm':'active';render();
}

function copyText(text,btn){
navigator.clipboard.writeText(text).then(()=>{
btn.textContent='✅ Copied!';btn.classList.add('copied');
const toast=document.getElementById('toast');toast.classList.add('show');
setTimeout(()=>{toast.classList.remove('show');btn.textContent='📋 Copy Hook';btn.classList.remove('copied')},1800);
});
}

render();
</script>
</body>
</html>
