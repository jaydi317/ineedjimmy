  <title>Grab time with Jimmy</title>
  <style>
    :root { color-scheme: light; }

    main { max-width: 560px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1; }
    p { margin: 0; font-size: 1.12rem; line-height: 1.55; color: #554e55; }

<body>
  <main>
    <h1>Jimmy opens a small number of times each week.</h1>
