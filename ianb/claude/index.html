<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ian Borgerhoff Wedding Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;600;700&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}

/* Layout: one page, five panels (Flow, three homepage looks, Research) behind a small mockup toolbar.
   Each look commits to a single visual world, so each sets its own colors explicitly. */
:root{
  /* toolbar + utility panels */
  --tool-bg:#1C1D20; --tool-fg:#ECEBE8; --tool-mute:#9A9893; --tool-on:#F2C14E;
  --util-bg:#F6F5F2; --util-fg:#1D1E21; --util-mute:#64635F; --util-line:#DEDCD6; --util-accent:#2B4A7E;
  --chip-bg:#FFE27A; --chip-fg:#3A2C00;
  /* V1 Proven: editorial, Indiana limestone + War Memorial navy */
  --v1-paper:#FAF9F6; --v1-stone:#EEEBE5; --v1-ink:#17181B; --v1-mute:#66645F; --v1-line:#DFDBD3; --v1-navy:#1F2D4A;
  --v1-display:"Bodoni Moda",Didot,"Bodoni 72",Georgia,serif; --v1-body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  /* V2 Darkroom: developing tray, fiber paper, grease pencil */
  --v2-tray:#121010; --v2-tray2:#1A1716; --v2-paper:#ECE6DB; --v2-silver:#A9A39B; --v2-line:#2C2725; --v2-grease:#D5432F;
  --v2-display:"Instrument Serif",Georgia,serif; --v2-body:"Instrument Sans",system-ui,sans-serif; --v2-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  /* V3 Offer-first: a letter with a highlighter */
  --v3-white:#FFFFFF; --v3-soft:#F3F5F8; --v3-ink:#14171C; --v3-mute:#585E68; --v3-line:#E1E5EB; --v3-blue:#1D3A6E; --v3-marker:#FFE68A;
  --v3-display:"Newsreader",Georgia,serif; --v3-body:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--tool-bg);color:var(--util-fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
.chip{display:inline-block;background:var(--chip-bg);color:var(--chip-fg);font:600 11px/1.3 system-ui,sans-serif;letter-spacing:.02em;padding:3px 7px;border-radius:4px;vertical-align:middle;margin:2px 4px;text-transform:none;font-style:normal;white-space:normal;text-align:left}
body.clean .chip{display:none}
:focus-visible{outline:2px solid var(--tool-on);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- toolbar ---------- */
.tool{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--tool-bg);color:var(--tool-fg);border-bottom:1px solid #2E2F33}
.tool .row{display:flex;align-items:center;gap:10px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.tool .row::-webkit-scrollbar{display:none}
.tool .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tool-mute);white-space:nowrap}
.tool button{font:500 13px/1 system-ui,sans-serif;color:var(--tool-fg);background:transparent;border:1px solid #3A3B40;border-radius:999px;padding:8px 12px;white-space:nowrap;cursor:pointer;min-height:36px}
.tool button[aria-pressed="true"]{background:var(--tool-on);border-color:var(--tool-on);color:#1C1D20}
.tool .sep{width:1px;height:20px;background:#3A3B40;flex:none}
.tool .sub{border-top:1px solid #2A2B2F}
.tool .sub[hidden]{display:none}

/* ---------- utility panels (Flow, Research) ---------- */
.util{background:var(--util-bg);color:var(--util-fg);padding-block:40px 80px}
.util h1{font:500 clamp(28px,4vw,40px)/1.15 var(--v1-body);margin:0 0 8px;text-wrap:balance}
.util h2{font:500 22px/1.25 var(--v1-body);margin:40px 0 12px}
.util p{max-width:68ch;color:var(--util-mute);margin:0 0 12px}
.util .lead{color:var(--util-fg);font-size:18px}
.tbl{overflow-x:auto;border:1px solid var(--util-line);border-radius:8px;background:#fff}
.tbl table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--util-line)}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--util-mute);background:#FBFAF8}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.ian td{background:#FFF6D6}
.talk{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.talk div{background:#fff;border:1px solid var(--util-line);border-radius:8px;padding:16px 18px;min-width:0}
.talk b{display:block;font-size:17px;margin-bottom:6px;color:var(--util-fg)}
.talk p{margin:0;font-size:15px}
.src{font-size:13px;color:var(--util-mute);columns:2 320px;padding-left:18px}
.src li{margin-bottom:6px;break-inside:avoid;overflow-wrap:anywhere}

/* ================= V1 PROVEN ================= */
.v1{background:var(--v1-paper);color:var(--v1-ink);font-family:var(--v1-body);font-weight:300;font-size:17px;line-height:1.65}
.v1 h1,.v1 h2,.v1 h3{font-family:var(--v1-display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
.v1 .eyebrow{font:500 12px/1.4 var(--v1-body);letter-spacing:.22em;text-transform:uppercase;color:var(--v1-mute)}
.v1 header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px max(16px,calc((100% - 1180px)/2))}
.v1 .mark{font:400 22px/1 var(--v1-display);letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
.v1 nav{display:flex;gap:28px;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.v1 nav a{text-decoration:none}
.v1 nav .hide-s{display:inline}
.v1 .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;background:var(--v1-navy);color:#fff;text-decoration:none;font:500 13px/1 var(--v1-body);letter-spacing:.16em;text-transform:uppercase;border:0;cursor:pointer}
.v1 .btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.v1 .hero{position:relative;height:clamp(520px,78vh,780px);overflow:hidden;color:#fff;background:#222}
.v1 .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.v1 .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,16,.72) 0%,rgba(10,12,16,.45) 45%,rgba(10,12,16,0) 75%),linear-gradient(180deg,rgba(10,12,16,0) 45%,rgba(10,12,16,.6) 100%)}
.v1 .hero h1{font-weight:500}
.v1 .hero .in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-block:0 48px}
.v1 .hero .eyebrow{color:rgba(255,255,255,.85)}
.v1 .hero h1{font-size:clamp(40px,6.4vw,84px);line-height:1.02;margin:14px 0 18px;max-width:15ch}
.v1 .hero h1.long{font-size:clamp(32px,4.4vw,58px);max-width:20ch}
.v1 .hero p{max-width:52ch;font-size:18px;color:rgba(255,255,255,.92);margin:0 0 26px}
.v1 .hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.v1 .hero .btn{background:#fff;color:var(--v1-ink)}
.v1 .hero .btn.ghost{background:transparent;color:#fff}
.v1 .trust{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:14px;color:rgba(255,255,255,.88)}
.v1 .stars{letter-spacing:.12em}
.v1 .proof{border-bottom:1px solid var(--v1-line);background:var(--v1-paper)}
.v1 .proof .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.v1 .proof div{padding:28px 18px;border-left:1px solid var(--v1-line);min-width:0}
.v1 .proof div:first-child{border-left:0}
.v1 .proof b{display:block;font:400 34px/1.1 var(--v1-display)}
.v1 .proof span{font-size:13px;letter-spacing:.06em;color:var(--v1-mute)}
.v1 section{padding-block:96px}
.v1 .split{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.v1 .split>*{min-width:0}
.v1 h2{font-size:clamp(34px,4.6vw,58px);line-height:1.05;margin:12px 0 22px}
.v1 p{margin:0 0 16px;max-width:60ch}
.v1 .big{font-size:20px;color:var(--v1-ink)}
.v1 .story{background:var(--v1-stone)}
.v1 .story .split{grid-template-columns:1fr 1.15fr;align-items:start}
.v1 .ianph{aspect-ratio:4/5;background:#D9D4CA;display:grid;place-items:center;text-align:center;padding:24px;color:var(--v1-mute);font-size:14px}
.v1 blockquote{margin:28px 0 0;padding:0 0 0 22px;border-left:1px solid var(--v1-ink);font:italic 400 26px/1.35 var(--v1-display)}
.v1 .twenty{text-align:center}
.v1 .twenty .n{font:400 clamp(160px,30vw,320px)/.85 var(--v1-display);letter-spacing:-.04em;margin:0}
.v1 .twenty h2{margin-top:0}
.v1 .twenty p{margin-inline:auto}
.v1 .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:40px;counter-reset:s}
.v1 .steps li{list-style:none;border-top:1px solid var(--v1-ink);padding-top:18px;min-width:0}
.v1 .steps ol{padding:0;margin:0}
.v1 .steps h3{font-size:24px;margin:6px 0 10px}
.v1 .steps .k{font:500 12px var(--v1-body);letter-spacing:.2em;color:var(--v1-mute)}
.v1 .steps p{font-size:16px}
.v1 .venues{background:var(--v1-ink);color:#fff}
.v1 .venues .eyebrow{color:rgba(255,255,255,.7)}
.v1 .vscroll{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,380px);gap:16px;overflow-x:auto;padding:8px 16px 18px;margin-top:28px;scroll-snap-type:x mandatory}
.v1 .vscroll figure{margin:0;scroll-snap-align:start}
.v1 .vscroll img{aspect-ratio:4/3;object-fit:cover;width:100%}
.v1 .vscroll figcaption{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:10px;color:rgba(255,255,255,.85)}
.v1 .pq{margin-top:40px;max-width:760px;font:italic 400 22px/1.45 var(--v1-display);color:rgba(255,255,255,.92)}
.v1 .pq small{display:block;font:400 13px/1.4 var(--v1-body);letter-spacing:.1em;text-transform:uppercase;margin-top:12px;color:rgba(255,255,255,.65);font-style:normal}
.v1 .gal{columns:3 260px;column-gap:14px;margin-top:36px}
.v1 .gal img{width:100%;margin-bottom:14px;break-inside:avoid}
.v1 .revs{display:grid;grid-template-columns:repeat(3,1fr);gap:40px 36px;margin-top:40px}
.v1 .revs figure{margin:0;min-width:0}
.v1 .revs q{display:block;font:italic 400 21px/1.45 var(--v1-display);quotes:"“" "”"}
.v1 .revs figcaption{margin-top:14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--v1-mute)}
.v1 .pros{margin-top:72px;padding-top:40px;border-top:1px solid var(--v1-line)}
.v1 .pros .revs q{font-size:18px}
.v1 .parents{background:var(--v1-stone)}
.v1 .invest .split{align-items:start}
.v1 .price{font:400 clamp(44px,6vw,72px)/1 var(--v1-display);margin:8px 0 6px}
.v1 ul.inc{padding:0;margin:20px 0 0;list-style:none;border-top:1px solid var(--v1-line)}
.v1 ul.inc li{padding:13px 0;border-bottom:1px solid var(--v1-line)}
.v1 .book{background:var(--v1-stone);padding:32px}
.v1 .book ol{padding-left:20px;margin:14px 0 22px}
.v1 .book li{margin-bottom:10px}
.v1 details{border-bottom:1px solid var(--v1-line);padding:20px 0}
.v1 summary{cursor:pointer;font:400 22px/1.3 var(--v1-display);list-style:none;display:flex;justify-content:space-between;gap:16px}
.v1 summary::after{content:"+";font-family:var(--v1-body);font-weight:300}
.v1 details[open] summary::after{content:"–"}
.v1 details p{margin-top:12px}
.v1 .final{background:var(--v1-navy);color:#fff}
.v1 .final .eyebrow{color:rgba(255,255,255,.7)}
.v1 form{display:grid;gap:14px;margin-top:8px}
.v1 label{display:grid;gap:6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.v1 input,.v1 textarea{font:400 17px var(--v1-body);padding:13px 14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.06);color:#fff;border-radius:0;width:100%}
.v1 .final .btn{background:#fff;color:var(--v1-navy)}
.v1 .phone{margin-top:20px;font-size:15px;color:rgba(255,255,255,.85)}
.v1 footer{padding-block:40px;font-size:14px;color:var(--v1-mute)}
.v1 footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between}

/* ================= V2 DARKROOM ================= */
.v2{background:var(--v2-tray);color:var(--v2-paper);font-family:var(--v2-body);font-size:17px;line-height:1.6;color-scheme:dark}
.v2 h1,.v2 h2,.v2 h3{font-family:var(--v2-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.005em}
.v2 .edge{font:500 11px/1 var(--v2-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--v2-silver)}
.v2 header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px max(16px,calc((100% - 1180px)/2))}
.v2 .mark{font:400 26px/1 var(--v2-display);text-decoration:none}
.v2 nav{display:flex;gap:22px;align-items:center;font:500 12px var(--v2-mono);letter-spacing:.14em;text-transform:uppercase}
.v2 nav a{text-decoration:none;color:var(--v2-silver)}
.v2 .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;background:var(--v2-paper);color:var(--v2-tray);text-decoration:none;font:600 14px/1 var(--v2-body);letter-spacing:.02em;border:0;cursor:pointer}
.v2 .btn.ghost{background:transparent;color:var(--v2-paper);border:1px solid var(--v2-silver)}
.v2 .sprocket{height:22px;background:repeating-linear-gradient(90deg,#000 0 12px,#3A3431 12px 22px) 0 6px/100% 10px no-repeat,#000;border-block:1px solid var(--v2-line)}
.v2 .sprocket span{display:none}
.v2 .hero{padding-block:28px 64px}
.v2 .frame{background:#000;padding:14px 14px 34px;position:relative}
.v2 .frame img{width:100%;aspect-ratio:3/2;object-fit:cover}
.v2 .frame .edge{position:absolute;left:14px;right:14px;bottom:11px;display:flex;justify-content:space-between;gap:12px;color:#8C857C}
.v2 .hero .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:48px;align-items:end;margin-top:28px}
.v2 .hero .grid>*{min-width:0}
.v2 .hero h1{font-size:clamp(42px,6vw,80px);line-height:1;margin:0}
.v2 .hero h1.long{font-size:clamp(34px,4.4vw,58px)}
.v2 .hero h1 em{font-style:italic;color:var(--v2-silver)}
.v2 .hero p{color:#CFC8BD;margin:0 0 22px;max-width:46ch}
.v2 .ctas{display:flex;gap:12px;flex-wrap:wrap}
.v2 .trust{margin-top:18px;font:500 12px/1.6 var(--v2-mono);letter-spacing:.06em;color:var(--v2-silver)}
.v2 .stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--v2-line);border-bottom:1px solid var(--v2-line)}
.v2 .stats div{padding:24px 16px;border-left:1px solid var(--v2-line);min-width:0}
.v2 .stats div:first-child{border-left:0}
.v2 .stats b{display:block;font:400 38px/1 var(--v2-display);margin-bottom:6px}
.v2 .stats span{font:500 11px/1.5 var(--v2-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--v2-silver)}
.v2 section{padding-block:88px}
.v2 h2{font-size:clamp(36px,5vw,64px);line-height:1.02;margin:14px 0 22px}
.v2 p{margin:0 0 16px;max-width:60ch;color:#D8D1C6}
.v2 .two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.v2 .two>*{min-width:0}
.v2 .print{background:var(--v2-paper);padding:12px 12px 40px;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(-1.2deg)}
.v2 .print img{filter:grayscale(1) contrast(1.05)}
.v2 .print .edge{display:block;margin-top:12px;color:#5D564E}
.v2 .story{background:var(--v2-tray2)}
.v2 .timeline{list-style:none;padding:0;margin:28px 0 0;border-left:1px solid var(--v2-line)}
.v2 .timeline li{padding:0 0 20px 22px;position:relative}
.v2 .timeline li::before{content:"";position:absolute;left:-4px;top:9px;width:7px;height:7px;background:var(--v2-silver);border-radius:50%}
.v2 .timeline .edge{display:block;margin-bottom:4px}
.v2 .ianph{aspect-ratio:4/5;border:1px dashed var(--v2-silver);display:grid;place-items:center;text-align:center;padding:24px;color:var(--v2-silver);font-size:14px}
.v2 .quote{font:italic 400 clamp(28px,3.4vw,40px)/1.2 var(--v2-display);margin:28px 0 0;color:var(--v2-paper)}
.v2 .twenty{border-block:1px solid var(--v2-line)}
.v2 .twenty .two{grid-template-columns:auto 1fr}
.v2 .twenty .n{font:400 clamp(150px,22vw,260px)/.8 var(--v2-display);color:var(--v2-paper)}
.v2 .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--v2-line);border:1px solid var(--v2-line);margin-top:36px}
.v2 .steps div{background:var(--v2-tray);padding:28px;min-width:0}
.v2 .steps h3{font-size:30px;margin:10px 0}
.v2 .steps p{font-size:16px}
.v2 .sheet{background:#000;padding:18px;margin-top:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px}
.v2 .sheet figure{margin:0;position:relative;min-width:0}
.v2 .sheet img{width:100%;aspect-ratio:3/2;object-fit:cover}
.v2 .sheet figcaption{display:flex;justify-content:space-between;font:500 10px/1 var(--v2-mono);letter-spacing:.12em;color:#8C857C;margin-top:6px;gap:6px}
.v2 .sheet figcaption span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v2 .sheet .keep svg{position:absolute;inset:-10px -12px 6px -12px;width:calc(100% + 24px);height:calc(100% - 4px);pointer-events:none;overflow:visible}
.v2 .sheet .keep figcaption span:first-child{color:var(--v2-grease)}
.v2 .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.v2 .notes figure{margin:0;background:var(--v2-paper);color:#2A2522;padding:22px 22px 18px;min-width:0}
.v2 .notes q{display:block;font:400 21px/1.4 var(--v2-display);quotes:"“" "”"}
.v2 .notes figcaption{font:500 11px/1.5 var(--v2-mono);letter-spacing:.1em;text-transform:uppercase;color:#6E665D;margin-top:14px}
.v2 .notes.pros figure{background:var(--v2-tray2);color:var(--v2-paper);border:1px solid var(--v2-line)}
.v2 .notes.pros figcaption{color:var(--v2-silver)}
.v2 .rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;margin-top:32px}
.v2 .rooms figure{margin:0;min-width:0}
.v2 .rooms img{aspect-ratio:1/1;object-fit:cover;width:100%}
.v2 .rooms figcaption{margin-top:8px}
.v2 .invest{background:var(--v2-paper);color:var(--v2-tray)}
.v2 .invest p{color:#3F3934}
.v2 .invest .edge{color:#6E665D}
.v2 .invest .price{font:400 clamp(48px,7vw,88px)/1 var(--v2-display);margin:10px 0}
.v2 .invest ul{padding:0;list-style:none;margin:18px 0 0}
.v2 .invest li{padding:12px 0;border-bottom:1px solid #CFC7BA}
.v2 .invest .btn{background:var(--v2-tray);color:var(--v2-paper)}
.v2 .invest ol{padding-left:20px}
.v2 .invest ol li{border:0;padding:6px 0}
.v2 details{border-bottom:1px solid var(--v2-line);padding:18px 0}
.v2 summary{cursor:pointer;font:400 26px/1.25 var(--v2-display);list-style:none}
.v2 summary::-webkit-details-marker{display:none}
.v2 details p{margin-top:10px}

/* chips: [[CONFIRM: x]] -> visible yellow note */
const t = s => String(s).replace(/\[\[(CONFIRM|ASK)(?::\s*)?([^\]]*)\]\]/g, (m,k,x) => '<span class="chip">' + (k==="ASK"?"Ask: ":"Confirm") + (x? (k==="ASK"?"":": ") + x : "") + '</span>');
const esc = s => String(s).replace(/&(?!nbsp;)/g,"&amp;").replace(/</g,"&lt;");
const tt = s => t(esc(s));
const state = { tab: "proven", h: { proven: 0, darkroom: 0, offer: 1 } };

function headline(i, cls){
  const H = C.heads[i];
  const plain = H.h.replace(/&nbsp;/g," ").replace(/<[^>]+>/g,"");
  return '<h1 class="'+(cls||"")+(plain.length>44?" long":"")+'">' + H.h + '</h1>' + (H.attr ? '<p class="attr">— ' + H.attr + '</p>' : '') + (H.note ? t(H.note) : '');
}
/* movie-poster laurel: leaves drawn along an arc, mirrored */
function laurel(a, b, note){
  let s = "";
  for (let i = 0; i < 8; i++){
    const th = (128 + i*15) * Math.PI/180;
    const x = 60 + 46*Math.cos(th), y = 54 + 42*Math.sin(th);
    const rot = th*180/Math.PI + 90 + 28;
    s += '<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="8" ry="3.2" transform="rotate('+rot.toFixed(0)+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>';
  }
  return '<div class="laurel"><svg viewBox="0 0 120 108" aria-hidden="true"><g fill="currentColor">'+s+'</g><g fill="currentColor" transform="translate(120 0) scale(-1 1)">'+s+'</g></svg><div class="lt"><b>'+esc(a)+'</b><span>'+esc(b)+'</span></div>'+(note?t(note):"")+'</div>';
}
function wallHTML(){
  return '<div class="laurels">' + C.laurels.map(l => laurel(l[0], l[1], l[2])).join("") + '</div>' +
    '<div class="wallq">' + C.wall.map(w => '<figure class="'+(w[2]?"big":"")+'"><div class="st" aria-label="5 stars">★★★★★</div><q>'+esc(w[0])+'</q><figcaption>'+esc(w[1])+'</figcaption></figure>').join("") + '</div>';
}

/* ================= wiring ================= */
const panels = { flow: "p-flow", proven: "p-proven", darkroom: "p-darkroom", offer: "p-offer", research: "p-research" };
const render = { flow: renderFlow, proven: renderV1, darkroom: renderV2, offer: renderV3, research: renderResearch };
function draw(tab){ document.getElementById(panels[tab]).innerHTML = render[tab](); }
function show(tab, scroll){
  if(!panels[tab]) tab = "proven";
  state.tab = tab;
  for (const k in panels) document.getElementById(panels[k]).hidden = (k !== tab);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  const isLook = tab in state.h;
  document.getElementById("subtools").hidden = !isLook;
  if (isLook) document.querySelectorAll("#subtools [data-h]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.h === state.h[tab])));
  if (scroll) window.scrollTo(0,0);
}
Object.keys(panels).forEach(draw);

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  show(b.dataset.tab, true);
  try { history.replaceState(null, "", "#" + b.dataset.tab); } catch(_) {}
});
document.getElementById("subtools").addEventListener("click", e => {
  const b = e.target.closest("button[data-h]"); if(!b) return;
  state.h[state.tab] = +b.dataset.h; draw(state.tab); show(state.tab, false);
});
document.getElementById("notes").addEventListener("click", e => {
  const on = document.body.classList.toggle("clean");
  e.currentTarget.setAttribute("aria-pressed", String(!on));
  e.currentTarget.textContent = on ? "Yellow notes off" : "Yellow notes on";
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if(!f) return;
  e.preventDefault(); const m = f.querySelector(".fmsg"); if (m) m.hidden = false;
});
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]'); if(!a) return;
  const id = a.getAttribute("href").slice(1);
  if (panels[id]) { e.preventDefault(); show(id, true); return; }
  const el = document.getElementById(id);
  if (el) { e.preventDefault(); const top = el.getBoundingClientRect().top + window.scrollY - 112; window.scrollTo({ top, behavior: "smooth" }); }
});
const start = (location.hash || "").slice(1);
show(panels[start] ? start : "proven", false);
})();
</script>
